name: All-in-One Emulation Nightlies

on:
  schedule:
    - cron: '30 8 * * *' # Runs every day at 08:30 UTC
  workflow_dispatch:

jobs:
  # ==================================================================
  # JOB 1: Box64 Matrix (All 6 Variants)
  # ==================================================================
  build-box64-matrix:
    name: Build Box64 ${{ matrix.source }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [Native, Bionic, WOW64]
        source: [Official, Hybrid]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make python3 p7zip-full wget tar file unzip xz-utils zip

      # --- CACHE BLOCKS ---
      - name: Cache Android NDK
        if: matrix.type != 'WOW64'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r26b
          key: android-ndk-r26b-linux

      - name: Cache LLVM-MinGW (WOW64)
        if: matrix.type == 'WOW64'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64
          key: llvm-mingw-20240619
      # --------------------

      - name: Setup Toolchain (Android)
        if: matrix.type != 'WOW64'
        run: |
          if [ ! -d "$PWD/android-ndk-r26b" ]; then
            echo "Cache miss: Downloading NDK..."
            wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
            unzip -q android-ndk-r26b-linux.zip
          else
            echo "Cache hit: NDK found!"
          fi

          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
          if [ "${{ matrix.type }}" == "Bionic" ]; then
            echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV
          else
            echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" >> $GITHUB_ENV
          fi

      - name: Setup Toolchain (WOW64 MinGW)
        if: matrix.type == 'WOW64'
        run: |
          LLVM_MINGW_VERSION=20240619
          if [ ! -d "$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64" ]; then
            echo "Cache miss: Downloading LLVM-MinGW..."
            wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz
            tar -xf llvm-mingw-*.tar.xz
          else
            echo "Cache hit: LLVM-MinGW found!"
          fi

          echo "MINGW_PATH=$PWD/$(ls -d llvm-mingw-* | head -n 1)/bin" >> $GITHUB_ENV

      - name: Clone & Merge Source
        run: |
          git clone https://github.com/ptitSeb/box64 source
          cd source
          # ptitSeb base commit, captured BEFORE any merge so Hybrid names carry
          # the same base sha as Official (the Pipetto merge is implied by "Hybrid").
          echo "BASE_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

          if [ "${{ matrix.source }}" == "Hybrid" ]; then
            git remote add pipetto https://github.com/Pipetto-crypto/box64
            git fetch pipetto
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            # src/emu/x64printer.c is debug-only call tracing (BOX64_LOG). ptitSeb and
            # Pipetto both keep appending adjacent "else if (w == iF...)" signature
            # branches, which collide textually but never semantically. Union-merge
            # that one file so both sides' branches are kept instead of conflicting.
            echo 'src/emu/x64printer.c merge=union' > .git/info/attributes
            git merge pipetto/main --no-edit || {
              echo "MERGE FAILED - unresolved conflicts:"; git diff --name-only --diff-filter=U; exit 1; }
          fi

          if [ "${{ matrix.type }}" == "WOW64" ]; then
            mkdir -p wine/common
            echo -e '\nint __mingw_vsprintf(char* buffer, const char* format, va_list args) { return vsprintf(buffer, format, args); }' >> wine/common/crt.c
          fi

      - name: Get Version Info
        id: version
        run: |
          cd source
          COMMIT=$(git rev-parse --short HEAD)
          MAJOR=$(grep '#define BOX64_MAJOR' src/box64version.h | awk '{print $3}')
          MINOR=$(grep '#define BOX64_MINOR' src/box64version.h | awk '{print $3}')
          REVISION=$(grep '#define BOX64_REVISION' src/box64version.h | awk '{print $3}')
          VER="${MAJOR}.${MINOR}.${REVISION}"

          # WOW64 builds ship wowbox64.dll -> name them WOWBox64-* with the type
          # implied (no trailing -WOW64). Native/Bionic keep Box64-*-<type>.
          if [ "${{ matrix.type }}" == "WOW64" ]; then
            PREFIX="WOWBox64"
            TYPE_SUFFIX=""
          else
            PREFIX="Box64"
            TYPE_SUFFIX="-${{ matrix.type }}"
          fi

          if [ "${{ matrix.source }}" == "Official" ]; then
            echo "FULL_VERSION=${PREFIX}-${VER}-${COMMIT}${TYPE_SUFFIX}" >> $GITHUB_ENV
          else
            # Hybrid: use the ptitSeb base sha (BASE_COMMIT), NOT the local merge
            # commit HEAD, so the name matches Official + "Hybrid".
            echo "FULL_VERSION=${PREFIX}-${VER}-Hybrid-${BASE_COMMIT}${TYPE_SUFFIX}" >> $GITHUB_ENV
          fi

      - name: Configure and Build
        run: |
          mkdir build && cd build

          if [ "${{ matrix.type }}" == "WOW64" ]; then
            export PATH=$PATH:${{ env.MINGW_PATH }}
            cmake ../source \
              -DCMAKE_C_COMPILER=aarch64-w64-mingw32-gcc \
              -DWOW64=1 -DARM_DYNAREC=1 -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc) wowbox64
          else
            if [ "${{ matrix.type }}" == "Bionic" ]; then
              CMAKE_ARGS="-DBIONIC=1 -DTERMUX=0 -DHAVE_TRACE=0"
            else
              CMAKE_ARGS=""
            fi

            cmake ../source \
              -DCMAKE_C_COMPILER=${{ env.BOX64_COMPILER }} \
              -DANDROID=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1 -DCMAKE_BUILD_TYPE=Release $CMAKE_ARGS
            make -j$(nproc)

            if [ "${{ matrix.type }}" == "Bionic" ]; then
              readelf -d box64 | grep -q "NEEDED.*libc.so" || { echo "Linking failed!"; exit 1; }
            fi

            ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip box64
          fi

      - name: Package
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist

          if [ "${{ matrix.type }}" == "WOW64" ]; then
            cd build/wowbox64-prefix/src/wowbox64-build
            echo '{"type": "WOWBox64", "versionName": "${{ env.FULL_VERSION }}", "versionCode": 0, "description": "WOWBox64 ${{ matrix.source }}", "files": [{"source": "system32/wowbox64.dll", "target": "${system32}/wowbox64.dll"}]}' > profile.json

            mkdir -p system32 && cp wowbox64.dll system32/
            tar -cJf "${{ env.FULL_VERSION }}.wcp" system32 profile.json
            zip -r "${{ env.FULL_VERSION }}.zip" system32 profile.json

            mv *.wcp *.zip $GITHUB_WORKSPACE/dist/
          else
            cd build
            echo '{"type": "Box64", "versionName": "${{ env.FULL_VERSION }}", "versionCode": 0, "description": "Box64 ${{ matrix.source }} ${{ matrix.type }}", "files": [{"source": "box64", "target": "${bindir}/box64"}]}' > profile.json

            mkdir pkg_content
            cp box64 profile.json pkg_content/

            cd pkg_content
            zip -r "../${{ env.FULL_VERSION }}.zip" .
            tar -cf ../temp.tar .
            cd ..
            xz -9 -c temp.tar > "${{ env.FULL_VERSION }}.wcp"

            mv *.wcp *.zip $GITHUB_WORKSPACE/dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: box64-${{ matrix.source }}-${{ matrix.type }}
          path: dist/*

  # ==================================================================
  # JOB 2: FEXCore Nightly
  # ==================================================================
  build-fex:
    name: Build FEXCore
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip \
            build-essential python3 pkg-config cmake zstd \
            dos2unix perl tar unzip meson ninja-build wget

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          LLVM_MINGW_TAG="20251104"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Build FEX
        id: version
        run: |
          git clone --recursive https://github.com/FEX-Emu/FEX.git source
          cd source

          # Name by distance from the nearest FEX release tag:
          #   - exactly on the tag  -> stable release: FEXCore-<ver>-stable
          #   - N commits past it    -> nightly:        FEX-<ver>+N-Nightly-<sha>
          # so a drifted build is never mislabeled as the clean release.
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "FEX-Unknown")
          if [ "$BASE_TAG" = "FEX-Unknown" ]; then
            VERSION_NAME="FEX-Unknown-Nightly-${COMMIT_HASH}"
          else
            COMMITS_SINCE_TAG=$(git rev-list "${BASE_TAG}..HEAD" --count 2>/dev/null || echo 0)
            if [ "$COMMITS_SINCE_TAG" -gt 0 ]; then
              VERSION_NAME="${BASE_TAG}+${COMMITS_SINCE_TAG}-Nightly-${COMMIT_HASH}"
            else
              VERSION_NAME="FEXCore-${BASE_TAG#FEX-}-stable"
            fi
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT

          build_arch() {
            local triple="$1"
            local dest="$2"
            local build_dir="build-${triple}"

            rm -rf "$build_dir" && mkdir "$build_dir" && cd "$build_dir"
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              ..
            ninja -j 2
            DESTDIR="$dest" ninja install
            cd ..
          }

          build_arch "arm64ec" "../../stage-ec"
          build_arch "aarch64" "../../stage-wo"

      - name: Package
        run: |
          rm -rf final_package && mkdir -p final_package/system32
          DLL_EC=$(find stage-ec -type f -name '*.dll' | head -n 1)
          DLL_WOW=$(find stage-wo -type f -name '*.dll' | head -n 1)

          cp "$DLL_EC" final_package/system32/libarm64ecfex.dll
          cp "$DLL_WOW" final_package/system32/libwow64fex.dll
          /opt/llvm-mingw/bin/llvm-strip --strip-all final_package/system32/*.dll

          cat <<EOF > final_package/profile.json
          {
            "type": "FEXCore",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": ${{ github.run_number }},
            "description": "FEXCore Nightly\n${{ env.VERSION_NAME }}",
            "author": "FEX-Emu",
            "files": [
              { "source": "system32/libarm64ecfex.dll", "target": "\${system32}/libarm64ecfex.dll" },
              { "source": "system32/libwow64fex.dll", "target": "\${system32}/libwow64fex.dll" }
            ]
          }
          EOF

          cd final_package

          # Create WCP
          tar -cJf ../${{ env.VERSION_NAME }}.wcp .

          # Create ZIP
          zip -r ../${{ env.VERSION_NAME }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: fex-nightly
          path: |
            *.wcp
            *.zip

      # --- Unix (.so) variant: same FEX checkout as the DLLs above, so the
      #     DLLs + native aarch64 .so stay a matched pair for this exact commit.
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: android-ndk-r27c

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_VER="r27c"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -O ndk.zip
          rm -rf /tmp/ndk-x && mkdir -p /tmp/ndk-x
          unzip -q ndk.zip -d /tmp/ndk-x
          sudo rm -rf /opt/android-ndk
          sudo mv "/tmp/ndk-x/android-ndk-${NDK_VER}" /opt/android-ndk
          rm -rf ndk.zip /tmp/ndk-x

      - name: Build unix libs (aarch64 bionic .so)
        run: |
          set -euo pipefail
          # Native aarch64 FEX UnixLib .so, built for BIONIC (Android NDK r27c,
          # API 28) so it loads in WinNative/Bannerlator bionic wine — NOT glibc.
          # Built from THIS job's own FEX checkout (source/) so the DLLs + .so
          # remain a matched pair for this exact commit.
          # HARD-FAIL on an older FEX ref that lacks UnixLib — never emit a
          # DLL-only "-unix" wcp.
          if [ ! -f source/Source/Windows/UnixLib/FEXUnixLib.cpp ]; then
            echo "::error::No source/Source/Windows/UnixLib/FEXUnixLib.cpp in this FEX checkout (older ref) — cannot build unix .so"
            exit 1
          fi

          NDK="/opt/android-ndk"
          API=28
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang++"
          "$CXX" --version | head -1

          # bionic libc does NOT provide shm_open/shm_unlink, and nothing else
          # does either. Wine's loader dlopen()s this .so with RTLD_NOW, which
          # requires EVERY symbol resolved — an undefined shm_open makes dlopen
          # return NULL and the unixlib silently never loads. So DEFINE ENOSYS
          # stubs and compile them straight INTO the .so (FEX's SHM stats are
          # non-essential to translation; a failing stub is fine — FEX skips them).
          #
          # Header = DECLARATIONS only, force-included so FEXUnixLib.cpp (which
          # calls shm_open/shm_unlink via <sys/mman.h>, where bionic omits their
          # prototypes) still compiles.
          cat > /tmp/bionic_shm_decl.h <<'HDR'
          #pragma once
          #include <sys/types.h>
          extern "C" {
          int shm_open(const char* name, int oflag, mode_t mode);
          int shm_unlink(const char* name);
          }
          HDR

          # Stub = DEFINITIONS, compiled to an object and linked into each .so so
          # there are NO unresolved shm_open/shm_unlink symbols left for RTLD_NOW.
          cat > /tmp/fex_bionic_shm_stub.c <<'STUB'
          #include <errno.h>
          int shm_open(const char* n, int o, unsigned m){ (void)n; (void)o; (void)m; errno = ENOSYS; return -1; }
          int shm_unlink(const char* n){ (void)n; errno = ENOSYS; return -1; }
          STUB
          NDK_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          "$NDK_CC" -c -fPIC -O2 -o /tmp/fex_bionic_shm_stub.o /tmp/fex_bionic_shm_stub.c

          mkdir -p unixlibs
          # No -lrt (bionic folds it into libc); no --allow-shlib-undefined — with
          # the stub linked in, shm_open/shm_unlink are defined and the only
          # remaining UND symbols are libc (@LIBC) + libc++ (NEEDED
          # libc++_shared.so), which resolve at load from imagefs/usr/lib on
          # LD_LIBRARY_PATH.
          CXXFLAGS="-shared -fPIC -O2 -std=c++17 -g3 -gdwarf-4 -fno-omit-frame-pointer \
            -fasynchronous-unwind-tables -funwind-tables -mtune=generic \
            -include /tmp/bionic_shm_decl.h"
          # Same TU built twice, named for FEX's two UnixLib targets (byte-identical),
          # each with the shm stub object linked in.
          for name in libwow64fex libarm64ecfex; do
            "$CXX" $CXXFLAGS -o "unixlibs/${name}.so" \
              source/Source/Windows/UnixLib/FEXUnixLib.cpp /tmp/fex_bionic_shm_stub.o
          done

          # Wine libs are executable (0771); a 0600 .so cannot be dlopen'd on
          # Android. Make them executable so the packaged wcp carries the exec bit.
          chmod 0755 unixlibs/*.so

          echo "Built bionic unix .so (shm stubs compiled in):"
          file unixlibs/*.so
          # Self-check: hard-fail if shm_open/shm_unlink are still undefined.
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for name in libwow64fex libarm64ecfex; do
            BAD=$("$RE" --dyn-syms "unixlibs/${name}.so" | grep ' UND ' | grep -E 'shm_open|shm_unlink' || true)
            if [ -n "$BAD" ]; then
              echo "::error::${name}.so still has undefined shm symbols:"; echo "$BAD"; exit 1
            fi
          done
          echo "OK: no undefined shm_open/shm_unlink in the unix .so"

      - name: Package (unix wcp)
        run: |
          set -euo pipefail
          rm -rf final_package_unix
          mkdir -p final_package_unix/system32 final_package_unix/aarch64-unix

          # DLLs: reuse THIS job's already-built, matched DLLs (from final_package).
          cp final_package/system32/libarm64ecfex.dll final_package_unix/system32/libarm64ecfex.dll
          cp final_package/system32/libwow64fex.dll   final_package_unix/system32/libwow64fex.dll
          # .so: this job's matched bionic unix libs. Force the execute bit so
          # the wcp tar stores them 0755 (a 0600 .so cannot be dlopen'd on
          # Android; wine libs are 0771).
          cp unixlibs/libarm64ecfex.so final_package_unix/aarch64-unix/libarm64ecfex.so
          cp unixlibs/libwow64fex.so   final_package_unix/aarch64-unix/libwow64fex.so
          chmod 0755 final_package_unix/aarch64-unix/*.so

          # TODO(delivery-path): confirm the .so target dir from the proton
          # loader-search spike. On Bannerlator ${libdir}=imagefs/usr/lib, where
          # the FEX loader does NOT search — swap SO_TARGET_DIR when the spike
          # lands. Single-quoted so ${libdir} stays literal in the JSON below.
          SO_TARGET_DIR='${libdir}/wine/aarch64-unix'

          cat > final_package_unix/profile.json <<EOF
          {
            "type": "FEXCore",
            "versionName": "${VERSION_NAME}-unix",
            "versionCode": 0,
            "description": "FEXCore ${VERSION_NAME} +unix libs",
            "files": [
              { "source": "aarch64-unix/libarm64ecfex.so", "target": "${SO_TARGET_DIR}/libarm64ecfex.so" },
              { "source": "aarch64-unix/libwow64fex.so",   "target": "${SO_TARGET_DIR}/libwow64fex.so" },
              { "source": "system32/libarm64ecfex.dll",    "target": "\${system32}/libarm64ecfex.dll" },
              { "source": "system32/libwow64fex.dll",      "target": "\${system32}/libwow64fex.dll" }
            ]
          }
          EOF

          cd final_package_unix
          tar -cJf "../${VERSION_NAME}-unix.wcp" .

      - uses: actions/upload-artifact@v4
        with:
          name: fex-nightly-unix
          path: '*-unix.wcp'

  # ==================================================================
  # JOB 2b: FEXCore Nightly — PPA flavor
  # Same FEX HEAD as build-fex; different toolchain + recipe to mirror
  # the fex-emu-wine Launchpad PPA wcp:
  #   - bylaws/llvm-mingw 20250920  (clang 21.1.0 from bylaws/llvm-project)
  #   - Release + CFLAGS=-g           (debug info only for C, not C++)
  #   - INSTALL_PREFIX=/ + LIBDIR=/   (bakes "//fex-emu/HostThunks")
  #   - TUNE_ARCH=generic + TUNE_CPU=none  (generic codegen, no host leak)
  #   - No llvm-strip, no ninja install (cp DLLs from build/Bin)
  # Calibrated against an actual upstream FEX-2604 PPA wcp at -0.16% size drift.
  # ==================================================================
  build-fex-ppa:
    name: Build FEXCore (PPA flavor)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip \
            build-essential python3 pkg-config cmake zstd \
            dos2unix perl tar unzip meson ninja-build wget

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain (bylaws/llvm-mingw)
        run: |
          # bylaws/llvm-mingw 20250920 — same toolchain the FEX-Emu Launchpad
          # PPA uses for fex-emu-wine builds (verified via DW_AT_producer in
          # the 2511 + 2604 PPA wcps).
          LLVM_MINGW_TAG="20250920"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/bylaws/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Build FEX (PPA recipe)
        id: version
        run: |
          git clone --recursive https://github.com/FEX-Emu/FEX.git source
          cd source

          # Name by distance from the nearest FEX release tag (PPA flavor):
          #   - exactly on the tag  -> stable release: FEXCore-<ver>-stable-ppa
          #   - N commits past it    -> nightly:        FEX-<ver>+N-Nightly-<sha>-PPA
          # so a drifted build is never mislabeled as the clean release.
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "FEX-Unknown")
          if [ "$BASE_TAG" = "FEX-Unknown" ]; then
            VERSION_NAME="FEX-Unknown-Nightly-${COMMIT_HASH}-PPA"
            VERSION_SHORT="Unknown"
          else
            COMMITS_SINCE_TAG=$(git rev-list "${BASE_TAG}..HEAD" --count 2>/dev/null || echo 0)
            if [ "$COMMITS_SINCE_TAG" -gt 0 ]; then
              VERSION_NAME="${BASE_TAG}+${COMMITS_SINCE_TAG}-Nightly-${COMMIT_HASH}-PPA"
              VERSION_SHORT="${BASE_TAG#FEX-}+${COMMITS_SINCE_TAG}"
            else
              VERSION_NAME="FEXCore-${BASE_TAG#FEX-}-stable-ppa"
              VERSION_SHORT="${BASE_TAG#FEX-}"
            fi
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_SHORT=${VERSION_SHORT}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT

          build_arch() {
            local triple="$1"
            local build_dir="build-${triple}"

            rm -rf "$build_dir" && mkdir "$build_dir" && cd "$build_dir"
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/ \
              -DCMAKE_INSTALL_LIBDIR=/ \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              -DTUNE_ARCH=generic -DTUNE_CPU=none \
              ..
            ninja -j 2
            cd ..
          }

          build_arch "arm64ec"
          build_arch "aarch64"

      - name: Package (no strip)
        run: |
          rm -rf final_package && mkdir -p final_package/system32

          DLL_EC=$(find source/build-arm64ec/Bin -type f -name 'libarm64ecfex.dll' | head -n 1)
          DLL_WOW=$(find source/build-aarch64/Bin -type f -name 'libwow64fex.dll'  | head -n 1)

          cp "$DLL_EC"  final_package/system32/libarm64ecfex.dll
          cp "$DLL_WOW" final_package/system32/libwow64fex.dll
          # NOTE: deliberately no llvm-strip — preserves the C-only debug
          # sections that define the PPA flavor.

          # profile.json follows the FEX-Emu PPA wcp metadata, except versionName is
          # prefixed so component pickers show a self-identifying, PPA-distinct name.
          cat > final_package/profile.json <<EOF
          {
            "type": "FEXCore",
            "versionName": "FEX-${VERSION_SHORT}-PPA",
            "versionCode": 0,
            "description": "FEXCore Release from PPA",
            "files": [
              { "source": "system32/libarm64ecfex.dll", "target": "\${system32}/libarm64ecfex.dll" },
              { "source": "system32/libwow64fex.dll",   "target": "\${system32}/libwow64fex.dll" }
            ]
          }
          EOF

          cd final_package
          tar -cJf "../${VERSION_NAME}.wcp" .
          zip  -r  "../${VERSION_NAME}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: fex-nightly-ppa
          path: |
            *.wcp
            *.zip

      # --- Unix (.so) variant: same FEX checkout as the PPA DLLs above, so the
      #     DLLs + native aarch64 .so stay a matched pair for this exact commit.
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: android-ndk-r27c

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_VER="r27c"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -O ndk.zip
          rm -rf /tmp/ndk-x && mkdir -p /tmp/ndk-x
          unzip -q ndk.zip -d /tmp/ndk-x
          sudo rm -rf /opt/android-ndk
          sudo mv "/tmp/ndk-x/android-ndk-${NDK_VER}" /opt/android-ndk
          rm -rf ndk.zip /tmp/ndk-x

      - name: Build unix libs (aarch64 bionic .so)
        run: |
          set -euo pipefail
          # Native aarch64 FEX UnixLib .so, built for BIONIC (Android NDK r27c,
          # API 28) so it loads in WinNative/Bannerlator bionic wine — NOT glibc.
          # Built from THIS job's own FEX checkout (source/) so the DLLs + .so
          # remain a matched pair for this exact commit.
          # HARD-FAIL on an older FEX ref that lacks UnixLib — never emit a
          # DLL-only "-unix" wcp.
          if [ ! -f source/Source/Windows/UnixLib/FEXUnixLib.cpp ]; then
            echo "::error::No source/Source/Windows/UnixLib/FEXUnixLib.cpp in this FEX checkout (older ref) — cannot build unix .so"
            exit 1
          fi

          NDK="/opt/android-ndk"
          API=28
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang++"
          "$CXX" --version | head -1

          # bionic libc does NOT provide shm_open/shm_unlink, and nothing else
          # does either. Wine's loader dlopen()s this .so with RTLD_NOW, which
          # requires EVERY symbol resolved — an undefined shm_open makes dlopen
          # return NULL and the unixlib silently never loads. So DEFINE ENOSYS
          # stubs and compile them straight INTO the .so (FEX's SHM stats are
          # non-essential to translation; a failing stub is fine — FEX skips them).
          #
          # Header = DECLARATIONS only, force-included so FEXUnixLib.cpp (which
          # calls shm_open/shm_unlink via <sys/mman.h>, where bionic omits their
          # prototypes) still compiles.
          cat > /tmp/bionic_shm_decl.h <<'HDR'
          #pragma once
          #include <sys/types.h>
          extern "C" {
          int shm_open(const char* name, int oflag, mode_t mode);
          int shm_unlink(const char* name);
          }
          HDR

          # Stub = DEFINITIONS, compiled to an object and linked into each .so so
          # there are NO unresolved shm_open/shm_unlink symbols left for RTLD_NOW.
          cat > /tmp/fex_bionic_shm_stub.c <<'STUB'
          #include <errno.h>
          int shm_open(const char* n, int o, unsigned m){ (void)n; (void)o; (void)m; errno = ENOSYS; return -1; }
          int shm_unlink(const char* n){ (void)n; errno = ENOSYS; return -1; }
          STUB
          NDK_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          "$NDK_CC" -c -fPIC -O2 -o /tmp/fex_bionic_shm_stub.o /tmp/fex_bionic_shm_stub.c

          mkdir -p unixlibs
          # No -lrt (bionic folds it into libc); no --allow-shlib-undefined — with
          # the stub linked in, shm_open/shm_unlink are defined and the only
          # remaining UND symbols are libc (@LIBC) + libc++ (NEEDED
          # libc++_shared.so), which resolve at load from imagefs/usr/lib on
          # LD_LIBRARY_PATH.
          CXXFLAGS="-shared -fPIC -O2 -std=c++17 -g3 -gdwarf-4 -fno-omit-frame-pointer \
            -fasynchronous-unwind-tables -funwind-tables -mtune=generic \
            -include /tmp/bionic_shm_decl.h"
          # Same TU built twice, named for FEX's two UnixLib targets (byte-identical),
          # each with the shm stub object linked in.
          for name in libwow64fex libarm64ecfex; do
            "$CXX" $CXXFLAGS -o "unixlibs/${name}.so" \
              source/Source/Windows/UnixLib/FEXUnixLib.cpp /tmp/fex_bionic_shm_stub.o
          done

          # Wine libs are executable (0771); a 0600 .so cannot be dlopen'd on
          # Android. Make them executable so the packaged wcp carries the exec bit.
          chmod 0755 unixlibs/*.so

          echo "Built bionic unix .so (shm stubs compiled in):"
          file unixlibs/*.so
          # Self-check: hard-fail if shm_open/shm_unlink are still undefined.
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for name in libwow64fex libarm64ecfex; do
            BAD=$("$RE" --dyn-syms "unixlibs/${name}.so" | grep ' UND ' | grep -E 'shm_open|shm_unlink' || true)
            if [ -n "$BAD" ]; then
              echo "::error::${name}.so still has undefined shm symbols:"; echo "$BAD"; exit 1
            fi
          done
          echo "OK: no undefined shm_open/shm_unlink in the unix .so"

      - name: Package (unix wcp)
        run: |
          set -euo pipefail
          rm -rf final_package_unix
          mkdir -p final_package_unix/system32 final_package_unix/aarch64-unix

          # DLLs: reuse THIS job's already-built, matched DLLs (from final_package).
          cp final_package/system32/libarm64ecfex.dll final_package_unix/system32/libarm64ecfex.dll
          cp final_package/system32/libwow64fex.dll   final_package_unix/system32/libwow64fex.dll
          # .so: this job's matched bionic unix libs. Force the execute bit so
          # the wcp tar stores them 0755 (a 0600 .so cannot be dlopen'd on
          # Android; wine libs are 0771).
          cp unixlibs/libarm64ecfex.so final_package_unix/aarch64-unix/libarm64ecfex.so
          cp unixlibs/libwow64fex.so   final_package_unix/aarch64-unix/libwow64fex.so
          chmod 0755 final_package_unix/aarch64-unix/*.so

          # TODO(delivery-path): confirm the .so target dir from the proton
          # loader-search spike. On Bannerlator ${libdir}=imagefs/usr/lib, where
          # the FEX loader does NOT search — swap SO_TARGET_DIR when the spike
          # lands. Single-quoted so ${libdir} stays literal in the JSON below.
          SO_TARGET_DIR='${libdir}/wine/aarch64-unix'

          cat > final_package_unix/profile.json <<EOF
          {
            "type": "FEXCore",
            "versionName": "${VERSION_NAME}-unix",
            "versionCode": 0,
            "description": "FEXCore ${VERSION_NAME} +unix libs",
            "files": [
              { "source": "aarch64-unix/libarm64ecfex.so", "target": "${SO_TARGET_DIR}/libarm64ecfex.so" },
              { "source": "aarch64-unix/libwow64fex.so",   "target": "${SO_TARGET_DIR}/libwow64fex.so" },
              { "source": "system32/libarm64ecfex.dll",    "target": "\${system32}/libarm64ecfex.dll" },
              { "source": "system32/libwow64fex.dll",      "target": "\${system32}/libwow64fex.dll" }
            ]
          }
          EOF

          cd final_package_unix
          tar -cJf "../${VERSION_NAME}-unix.wcp" .

      - uses: actions/upload-artifact@v4
        with:
          name: fex-nightly-ppa-unix
          path: '*-unix.wcp'

  # ==================================================================
  # JOB 2c: FEXCore — OFFICIAL PPA repack (genuine .deb bytes)
  # Downloads the REAL fex-emu-wine .deb from the FEX-Emu Launchpad PPA
  # (ppa:fex-emu/fex) and repackages its two PE DLLs *verbatim* into a
  # wcp — the literal shipped bytes, NOT a source rebuild (that is what
  # build-fex-ppa does; this is one notch more authentic).
  #   - PE-only:  FEXCore-<ver>-official-ppa.wcp
  #   - unix:     FEXCore-<ver>-official-ppa-unix.wcp
  #               = official PE DLLs + the bionic UnixLib .so that
  #                 build-fex already built (upstream ships NO unix .so —
  #                 the arm64ec/wow64 design is PE-only, so the .so is our
  #                 Android host shim; there is no "official" .so).
  # Runs EVERY build: independently grabs whatever the newest release currently
  # PUBLISHED on the PPA is (decoupled from the nightly's FEX HEAD), so the
  # genuine upstream release is attached reliably, not only when a nightly happens
  # to land on a release tag. status=Published skips a yanked/failed build; the job
  # still succeeds and emits nothing if the PPA has no published arm64 build at all.
  # NOTE: the -unix variant pairs the genuine release DLLs with build-fex's HEAD
  # unixlib .so (upstream ships no unix .so); the .so may be newer than the release
  # DLLs, which is fine — it's the shm-stub UnixLib companion, ABI-stable.
  # ==================================================================
  repack-fex-ppa-official:
    name: Repack FEXCore (official PPA .deb)
    runs-on: ubuntu-latest
    needs: build-fex
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl jq xz-utils

      - name: Resolve latest published PPA release & download .deb
        id: rel
        run: |
          set -euo pipefail
          API="https://api.launchpad.net/devel/~fex-emu/+archive/ubuntu/fex"
          # DECOUPLED from the nightly's FEX HEAD: always grab whatever the NEWEST
          # release currently PUBLISHED on the fex-emu-wine PPA is, so every AIO run
          # attaches the genuine upstream release regardless of nightly timing.
          #   - status=Published is the yank gate: a pulled/failed build (status
          #     Deleted, as 2608-1 was briefly) is invisible here, so we grab the
          #     newest release that is actually LIVE — never a retracted one.
          #   - "newest" = highest leading release number (YYMM). The suffix scheme
          #     is inconsistent (2608-1~j vs 2608~1-3~r vs 2607~1-1~q vs 2601~p), so
          #     rank by the leading integer, then prefer ~j (jammy, the arm64ec
          #     toolchain target) else any arm64 build of that release.
          # Launchpad has intermittent 5xx / throttle spells. Without -f, curl writes the error
          # PAGE into bins.json and the jq below dies mid-parse ("Invalid numeric literal"),
          # which under set -e sinks the whole nightly over one optional attachment. Retry, then
          # gate on the body actually being JSON and fall through to the existing skip path.
          curl -fsSG --retry 5 --retry-delay 3 --retry-all-errors --max-time 60 "$API" \
            --data-urlencode "ws.op=getPublishedBinaries" \
            --data-urlencode "binary_name=fex-emu-wine" \
            --data-urlencode "exact_match=true" \
            --data-urlencode "status=Published" -o bins.json || true
          if ! jq -e . bins.json >/dev/null 2>&1; then
            echo "::warning::Launchpad returned no usable JSON for getPublishedBinaries — skipping official repack."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ENTRY=$(jq -c '
            [ .entries[] | select(.distro_arch_series_link | endswith("/arm64")) ] as $all
            | ( $all | map(.binary_package_version | capture("^(?<n>[0-9]+)").n | tonumber) | max ) as $mx
            | [ $all[] | select((.binary_package_version | capture("^(?<n>[0-9]+)").n | tonumber) == $mx) ] as $c
            | ( $c | map(select(.binary_package_version | endswith("~j"))) ) as $j
            | ( if ($j|length) > 0 then $j else $c end ) | .[0] // empty' bins.json)
          if [ -z "$ENTRY" ] || [ "$ENTRY" = "null" ]; then
            echo "::warning::No published fex-emu-wine arm64 build on the PPA — skipping official repack."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VER=$(jq -r '.binary_package_version | capture("^(?<n>[0-9]+)").n' <<<"$ENTRY")
          FULLVER=$(jq -r '.binary_package_version' <<<"$ENTRY")
          SELF=$(jq -r '.self_link' <<<"$ENTRY")
          curl -fsSG --retry 5 --retry-delay 3 --retry-all-errors --max-time 60 "$SELF" \
            --data-urlencode "ws.op=binaryFileUrls" -o urls.json || true
          if ! jq -e . urls.json >/dev/null 2>&1; then
            echo "::warning::Launchpad returned no usable JSON for binaryFileUrls — skipping official repack."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # first(...) not `| head -1`: under pipefail a second .deb line closes the pipe on jq
          # (SIGPIPE, exit 141) and fails the step for no reason.
          DEB_URL=$(jq -r 'first(.[] | select(endswith(".deb"))) // empty' urls.json)
          if [ -z "$DEB_URL" ]; then
            echo "::warning::No .deb among the published files for ${FULLVER} — skipping official repack."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Latest published PPA release: fex-emu-wine ${FULLVER}  ->  FEXCore-${VER}-official-ppa"
          if ! curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 "$DEB_URL" -o official.deb; then
            echo "::warning::Could not download ${DEB_URL} — skipping official repack."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Extract official PE DLLs
        if: steps.rel.outputs.found == 'true'
        run: |
          set -euo pipefail
          # dpkg-deb (preinstalled) handles the zstd-compressed data tree.
          dpkg-deb -x official.deb debroot
          mkdir -p pe
          cp debroot/usr/lib/wine/aarch64-windows/libarm64ecfex.dll pe/
          cp debroot/usr/lib/wine/aarch64-windows/libwow64fex.dll   pe/
          echo "Official DLL sha256:"; sha256sum pe/*.dll

      - name: Get bionic unix .so from build-fex
        if: steps.rel.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fex-nightly-unix
          path: unixwcp

      - name: Package official-ppa wcps
        if: steps.rel.outputs.found == 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.rel.outputs.ver }}"

          # ---- PE-only: FEXCore-<ver>-official-ppa.wcp (genuine bytes) ----
          rm -rf pkg; mkdir -p pkg/system32
          cp pe/*.dll pkg/system32/
          chmod 0755 pkg/system32/*.dll
          printf '{\n  "type": "FEXCore",\n  "versionName": "%s",\n  "versionCode": 0,\n  "description": "FEXCore Release from PPA",\n  "files": [\n    { "source": "system32/libarm64ecfex.dll", "target": "${system32}/libarm64ecfex.dll" },\n    { "source": "system32/libwow64fex.dll", "target": "${system32}/libwow64fex.dll" }\n  ]\n}\n' "$VER" > pkg/profile.json
          ( cd pkg && tar -cJf "../FEXCore-${VER}-official-ppa.wcp" . )
          echo "Built FEXCore-${VER}-official-ppa.wcp"

          # ---- unix variant: official DLLs + build-fex's bionic UnixLib .so ----
          SO_SRC=$(find unixwcp -name '*-unix.wcp' 2>/dev/null | head -1 || true)
          if [ -n "${SO_SRC:-}" ]; then
            mkdir -p sotmp && tar -xJf "$SO_SRC" -C sotmp
            rm -rf upkg; mkdir -p upkg/system32 upkg/aarch64-unix
            cp pe/*.dll upkg/system32/
            cp sotmp/aarch64-unix/libarm64ecfex.so upkg/aarch64-unix/
            cp sotmp/aarch64-unix/libwow64fex.so   upkg/aarch64-unix/
            chmod 0755 upkg/system32/*.dll upkg/aarch64-unix/*.so
            # ${libdir}/${system32} are wcp installer placeholders — keep literal.
            printf '{\n  "type": "FEXCore",\n  "versionName": "%s",\n  "versionCode": 0,\n  "description": "FEXCore Release from PPA +unix libs",\n  "files": [\n    { "source": "aarch64-unix/libarm64ecfex.so", "target": "${libdir}/wine/aarch64-unix/libarm64ecfex.so" },\n    { "source": "aarch64-unix/libwow64fex.so", "target": "${libdir}/wine/aarch64-unix/libwow64fex.so" },\n    { "source": "system32/libarm64ecfex.dll", "target": "${system32}/libarm64ecfex.dll" },\n    { "source": "system32/libwow64fex.dll", "target": "${system32}/libwow64fex.dll" }\n  ]\n}\n' "$VER" > upkg/profile.json
            ( cd upkg && tar -cJf "../FEXCore-${VER}-official-ppa-unix.wcp" . )
            echo "Built FEXCore-${VER}-official-ppa-unix.wcp"
          else
            echo "::warning::build-fex unix .so artifact missing — emitting PE-only official wcp, no -unix variant."
          fi

          echo "== official-ppa artifacts =="; ls -la *.wcp; sha256sum *.wcp

      - uses: actions/upload-artifact@v4
        if: steps.rel.outputs.found == 'true'
        with:
          name: fex-ppa-official
          path: '*-official-ppa*.wcp'
          if-no-files-found: ignore

  # ==================================================================
  # JOB 3: VKD3D-Proton (Standard)
  # ==================================================================
  build-vkd3d:
    name: Build VKD3D-Proton (Standard)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip \
            build-essential python3 pkg-config zstd \
            meson ninja-build wget unzip

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          LLVM_MINGW_TAG="20251104"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Build VKD3D
        id: version
        run: |
          git clone --recursive https://github.com/HansKristian-Work/vkd3d-proton src
          cd src
          COMMIT_HASH=$(git rev-parse --short HEAD)
          LATEST_TAG=$(git describe --tags --abbrev=0 | sed 's/^v//')
          VERSION_NAME="${LATEST_TAG}-${COMMIT_HASH}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          cd ..

          cat <<EOF > cross-x64.txt
          [binaries]
          c = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-clang'
          cpp = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-clang++'
          ar = '/opt/llvm-mingw/bin/llvm-ar'
          strip = '/opt/llvm-mingw/bin/llvm-strip'
          windres = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-windres'
          widl = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          exe_wrapper = ['wine']
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          cat <<EOF > cross-x86.txt
          [binaries]
          c = '/opt/llvm-mingw/bin/i686-w64-mingw32-clang'
          cpp = '/opt/llvm-mingw/bin/i686-w64-mingw32-clang++'
          ar = '/opt/llvm-mingw/bin/llvm-ar'
          strip = '/opt/llvm-mingw/bin/llvm-strip'
          windres = '/opt/llvm-mingw/bin/i686-w64-mingw32-windres'
          widl = '/opt/llvm-mingw/bin/i686-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          exe_wrapper = ['wine']
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

          cd src
          meson setup build-x64 --cross-file ../cross-x64.txt -Dbuildtype=release -Dstrip=true
          ninja -C build-x64 -j 2
          meson setup build-x86 --cross-file ../cross-x86.txt -Dbuildtype=release -Dstrip=true
          ninja -C build-x86 -j 2

      - name: Package
        run: |
          rm -rf final_package && mkdir -p final_package/system32 final_package/syswow64

          find src/build-x64 -name "d3d12.dll" -exec cp -L {} final_package/system32/ \;
          find src/build-x64 -name "d3d12core.dll" -exec cp -L {} final_package/system32/ \;
          find src/build-x86 -name "d3d12.dll" -exec cp -L {} final_package/syswow64/ \;
          find src/build-x86 -name "d3d12core.dll" -exec cp -L {} final_package/syswow64/ \;

          cat <<EOF > final_package/profile.json
          {
            "type": "VKD3D",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 1,
            "description": "Banners Repo - VKD3D-Proton master nightly (Upstream: HansKristian-Work)",
            "files": [
              {"source": "system32/d3d12.dll", "target": "\${system32}/d3d12.dll"},
              {"source": "system32/d3d12core.dll", "target": "\${system32}/d3d12core.dll"},
              {"source": "syswow64/d3d12.dll", "target": "\${syswow64}/d3d12.dll"},
              {"source": "syswow64/d3d12core.dll", "target": "\${syswow64}/d3d12core.dll"}
            ]
          }
          EOF

          cd final_package

          # Create WCP
          tar -cJf ../VKD3D-Proton-${{ env.VERSION_NAME }}.wcp *

          # Create ZIP
          zip -r ../VKD3D-Proton-${{ env.VERSION_NAME }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: vkd3d-standard
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 4: DXVK Nightly (Standard)
  # ==================================================================
  build-dxvk:
    name: Build DXVK (GPLAsync)
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout (for patch file)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wget git xz-utils python3 meson ninja-build build-essential unzip zip ccache patch

      - name: Get DXVK Upstream Commit
        id: dxvk-hash
        run: |
          HASH=$(git ls-remote https://github.com/doitsujin/dxvk.git HEAD | cut -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key tied to exact upstream commit — auto-busts when DXVK has new commits
          key: ccache-dxvk-standard-${{ steps.dxvk-hash.outputs.hash }}
          # Fallback: load nearest prior cache so unchanged files still get reused
          restore-keys: ccache-dxvk-standard-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup ccache compiler wrappers
        run: |
          # Create ccache-backed symlinks that shadow the real MinGW compilers.
          # package-release.sh picks compilers from PATH, so this is the cleanest
          # way to inject ccache without touching DXVK's own build scripts.
          mkdir -p ~/ccache-bin
          for compiler in \
            x86_64-w64-mingw32-gcc \
            x86_64-w64-mingw32-g++ \
            i686-w64-mingw32-gcc \
            i686-w64-mingw32-g++; do
            ln -s "$(which ccache)" ~/ccache-bin/$compiler
          done
          echo "$HOME/ccache-bin" >> $GITHUB_PATH
          ccache --max-size=1G
          ccache --zero-stats

      - name: Build DXVK
        id: version
        run: |
          PATCHES="$GITHUB_WORKSPACE/patches"
          # Bleeding edge: build upstream doitsujin/dxvk MASTER (latest commit) + Ph42oN's
          # newest MASTER gplasync patch (vendored under patches/) for a "true" gplasync.
          # COMPILE guard: a textually-applicable patch can still fail to BUILD after master
          # drifts (e.g. an upstream struct gains a field), so we PROVE the patched tree
          # compiles and, only if it does not, fall back to the last-good release
          # (v3.0 + gplasync-3.0-1) so the nightly still ships.

          # Job-specific COMPILE recipe (package-release.sh propagates ninja failure as non-zero).
          build_dxvk() {
            cd "$GITHUB_WORKSPACE/dxvk" || return 1
            # Use all available vCPUs (runners have 4; was hardcoded to 2)
            sed -i 's/\bninja\b/ninja -j$(nproc)/g' package-release.sh \
              && ./package-release.sh master ../dxvk-built --no-package
          }

          # Try upstream MASTER + master gplasync patch and PROVE IT COMPILES.
          # Returns non-zero if the patch fails to APPLY or the tree fails to COMPILE.
          attempt_master() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            git fetch --tags --force >/dev/null 2>&1 || true
            # patch --fuzz (not git apply): tolerates minor context drift vs a moving master.
            patch -p1 --fuzz=3 --dry-run < "$PATCHES/dxvk-gplasync-master.patch" >/dev/null 2>&1 || return 1
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-master.patch" || return 1
            build_dxvk || return 1
          }

          # Pinned known-good fallback: v3.0 + gplasync-3.0-1. Fatal if it fails.
          use_fallback() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules --branch v3.0 \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-3.0-1.patch"
            build_dxvk
          }

          if attempt_master; then
            echo "DXVK master patched tree built OK"
          else
            echo "::warning::DXVK master gplasync patch failed to APPLY or COMPILE — falling back to pinned v3.0 + gplasync-3.0-1. Re-vendor patches/dxvk-gplasync-master.patch from Ph42oN."
            use_fallback
          fi

          # Version reflects whichever tree actually built (master, or the v3.0 fallback).
          cd "$GITHUB_WORKSPACE/dxvk"
          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="${LATEST_TAG}-gplasync-${COMMIT_HASH}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package
        run: |
          mkdir -p packaging
          cp -r dxvk-built/dxvk-master/x64 packaging/system32
          cp -r dxvk-built/dxvk-master/x32 packaging/syswow64

          cat <<EOF > packaging/profile.json
          {
            "type": "DXVK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 0,
            "description": "Banners Repo (Upstream: Philip Rebohle, Patch: Ph42oN)",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF

          # WCP
          tar -cJf dxvk-gplasync-${{ steps.version.outputs.commit }}.wcp -C packaging .

          # ZIP
          cd packaging
          zip -r ../dxvk-gplasync-${{ steps.version.outputs.commit }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-nightly
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 5: VKD3D-Proton (ARM64EC)
  # ==================================================================
  build-vkd3d-arm64ec:
    name: Build VKD3D-Proton (ARM64EC)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip \
            build-essential python3 pkg-config zstd \
            meson ninja-build wget unzip

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          LLVM_MINGW_TAG="20251104"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Build ARM64EC
        id: version
        run: |
          git clone --recursive https://github.com/HansKristian-Work/vkd3d-proton src
          cd src
          COMMIT_HASH=$(git rev-parse --short HEAD)
          LATEST_TAG=$(git describe --tags --abbrev=0 | sed 's/^v//')
          VERSION_NAME="arm64ec-${LATEST_TAG}-${COMMIT_HASH}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          cd ..

          cat <<EOF > arm64ec.txt
          [binaries]
          c = 'arm64ec-w64-mingw32-clang'
          cpp = 'arm64ec-w64-mingw32-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'arm64ec-w64-mingw32-windres'
          widl = 'arm64ec-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          cat <<EOF > x86.txt
          [binaries]
          c = 'i686-w64-mingw32-clang'
          cpp = 'i686-w64-mingw32-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'i686-w64-mingw32-windres'
          widl = 'i686-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

          cd src
          meson setup build-ec --cross-file ../arm64ec.txt -Dbuildtype=release -Dstrip=true
          ninja -C build-ec -j 2
          meson setup build-x86 --cross-file ../x86.txt -Dbuildtype=release -Dstrip=true
          ninja -C build-x86 -j 2

      - name: Package
        run: |
          rm -rf final_package && mkdir -p final_package/system32 final_package/syswow64

          find src/build-ec -name "d3d12.dll" -exec cp -L {} final_package/system32/ \;
          find src/build-ec -name "d3d12core.dll" -exec cp -L {} final_package/system32/ \;
          find src/build-x86 -name "d3d12.dll" -exec cp -L {} final_package/syswow64/ \;
          find src/build-x86 -name "d3d12core.dll" -exec cp -L {} final_package/syswow64/ \;

          llvm-strip --strip-all final_package/system32/*.dll
          llvm-strip --strip-all final_package/syswow64/*.dll

          cat <<EOF > final_package/profile.json
          {
            "type": "VKD3D",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 1,
            "description": "Banners Repo - VKD3D-Proton master nightly ARM64EC (Upstream: HansKristian-Work)",
            "files": [
              {"source": "system32/d3d12.dll", "target": "\${system32}/d3d12.dll"},
              {"source": "system32/d3d12core.dll", "target": "\${system32}/d3d12core.dll"},
              {"source": "syswow64/d3d12.dll", "target": "\${syswow64}/d3d12.dll"},
              {"source": "syswow64/d3d12core.dll", "target": "\${syswow64}/d3d12core.dll"}
            ]
          }
          EOF

          cd final_package

          # WCP
          tar --zstd -cf ../VKD3D-Proton-${{ env.VERSION_NAME }}.wcp *

          # ZIP
          zip -r ../VKD3D-Proton-${{ env.VERSION_NAME }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: vkd3d-arm64ec
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 6: DXVK ARM64EC (GPLAsync)
  # ==================================================================
  build-dxvk-arm64ec:
    name: Build DXVK (ARM64EC)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl xz-utils jq git build-essential \
            python3 pkg-config zstd meson ninja-build wget unzip zip ccache patch

      - name: Get DXVK Upstream Commit
        id: dxvk-hash
        run: |
          HASH=$(git ls-remote https://github.com/doitsujin/dxvk.git HEAD | cut -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key tied to exact upstream commit — auto-busts when DXVK has new commits
          key: ccache-dxvk-arm64ec-${{ steps.dxvk-hash.outputs.hash }}
          # Fallback: load nearest prior cache so unchanged files still get reused
          restore-keys: ccache-dxvk-arm64ec-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Cache LLVM-MinGW
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          # Version-pinned — only re-downloads if you bump the tag below
          key: llvm-mingw-20251104-ubuntu22

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup LLVM-MinGW
        run: |
          if [ ! -d "/opt/llvm-mingw/bin" ]; then
            echo "Cache miss — downloading LLVM-MinGW..."
            LLVM_MINGW_TAG="20251104"
            wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
            sudo mkdir -p /opt/llvm-mingw
            sudo tar -C /opt/llvm-mingw --strip-components=1 -xJf llvm.tar.xz
          else
            echo "Cache hit — LLVM-MinGW ready."
          fi
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache --zero-stats

      - name: Configure Cross-Files
        run: |
          # ccache injected via the binaries array — cleanest approach for meson cross builds
          cat <<EOF > arm64ec.txt
          [binaries]
          c = ['ccache', 'arm64ec-w64-mingw32-clang']
          cpp = ['ccache', 'arm64ec-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'arm64ec-w64-mingw32-windres'
          widl = 'arm64ec-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          cat <<EOF > x86.txt
          [binaries]
          c = ['ccache', 'i686-w64-mingw32-clang']
          cpp = ['ccache', 'i686-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'i686-w64-mingw32-windres'
          widl = 'i686-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

      - name: Build
        id: version
        run: |
          PATCHES="$GITHUB_WORKSPACE/patches"
          # Bleeding edge: dxvk MASTER + Ph42oN gplasync (master). COMPILE guard: PROVE the
          # patched tree builds; only if it fails to APPLY or COMPILE fall back to v3.0 +
          # gplasync-3.0-1 so the nightly still ships. Cross files were written into
          # $GITHUB_WORKSPACE by the preceding "Configure Cross-Files" step.

          # Job-specific COMPILE recipe (meson + ninja cross-build; ../*.txt from Configure Cross-Files).
          build_dxvk() {
            cd "$GITHUB_WORKSPACE/dxvk" || return 1
            meson setup build-ec --cross-file ../arm64ec.txt -Dbuildtype=release -Dstrip=true \
              && meson setup build-x86 --cross-file ../x86.txt -Dbuildtype=release -Dstrip=true \
              && ninja -C build-ec -j$(nproc) \
              && ninja -C build-x86 -j$(nproc)
          }

          # Try upstream MASTER + master gplasync patch and PROVE IT COMPILES.
          # Returns non-zero if the patch fails to APPLY or the tree fails to COMPILE.
          attempt_master() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            git fetch --tags --force >/dev/null 2>&1 || true
            # patch --fuzz (not git apply): tolerates minor context drift vs a moving master.
            patch -p1 --fuzz=3 --dry-run < "$PATCHES/dxvk-gplasync-master.patch" >/dev/null 2>&1 || return 1
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-master.patch" || return 1
            build_dxvk || return 1
          }

          # Pinned known-good fallback: v3.0 + gplasync-3.0-1. Fatal if it fails.
          use_fallback() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules --branch v3.0 \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-3.0-1.patch"
            build_dxvk
          }

          if attempt_master; then
            echo "DXVK master patched tree built OK"
          else
            echo "::warning::DXVK master gplasync patch failed to APPLY or COMPILE — falling back to pinned v3.0 + gplasync-3.0-1. Re-vendor patches/dxvk-gplasync-master.patch from Ph42oN."
            use_fallback
          fi

          # Version reflects whichever tree actually built (master, or the v3.0 fallback).
          cd "$GITHUB_WORKSPACE/dxvk"
          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="${LATEST_TAG}-gplasync-arm64ec-${COMMIT_HASH}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package
        run: |
          mkdir -p packaging/system32
          mkdir -p packaging/syswow64

          copy_dll() {
            SRC_DIR=$1
            DEST_DIR=$2
            cp "dxvk/$SRC_DIR/src/d3d11/d3d11.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d10/d3d10core.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d9/d3d9.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d8/d3d8.dll" "$DEST_DIR/" || true
            cp "dxvk/$SRC_DIR/src/dxgi/dxgi.dll" "$DEST_DIR/"
          }
          copy_dll "build-ec" "packaging/system32"
          copy_dll "build-x86" "packaging/syswow64"
          llvm-strip --strip-all packaging/system32/*.dll
          llvm-strip --strip-all packaging/syswow64/*.dll

          cat <<EOF > packaging/profile.json
          {
            "type": "DXVK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 0,
            "description": "Banners Repo (Upstream: Philip Rebohle, Patch: Ph42oN)",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF

          cd packaging

          # WCP
          tar --zstd -cf ../DXVK-ARM64EC-${{ env.VERSION_NAME }}.wcp .

          # ZIP
          zip -r ../DXVK-ARM64EC-${{ env.VERSION_NAME }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-arm64ec
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 7: DXVK Binary-Semaphores (Standard, GPLAsync)
  # Same recipe as JOB 4 plus leegao's binary-semaphore queue fallback
  # (patches/dxvk-binary-semaphores.patch). Adds DXVK_DISABLE_TIMELINE_SEMAPHORES=1
  # runtime env to work around the Turnip-kgsl timeline-semaphore FPS regression
  # in DXVK 2.5+. The patch touches only dxvk_cmdlist/dxvk_queue, which do NOT
  # overlap the Ph42oN gplasync patch, so the two are layered together.
  # ==================================================================
  build-dxvk-binsem:
    name: Build DXVK BinSem (GPLAsync)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout (for patch file)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wget git xz-utils python3 meson ninja-build build-essential unzip zip ccache patch

      - name: Get DXVK Upstream Commit
        id: dxvk-hash
        run: |
          HASH=$(git ls-remote https://github.com/doitsujin/dxvk.git HEAD | cut -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key tied to exact upstream commit — auto-busts when DXVK has new commits
          key: ccache-dxvk-binsem-standard-${{ steps.dxvk-hash.outputs.hash }}
          restore-keys: ccache-dxvk-binsem-standard-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup ccache compiler wrappers
        run: |
          mkdir -p ~/ccache-bin
          for compiler in \
            x86_64-w64-mingw32-gcc \
            x86_64-w64-mingw32-g++ \
            i686-w64-mingw32-gcc \
            i686-w64-mingw32-g++; do
            ln -s "$(which ccache)" ~/ccache-bin/$compiler
          done
          echo "$HOME/ccache-bin" >> $GITHUB_PATH
          ccache --max-size=1G
          ccache --zero-stats

      - name: Build DXVK
        id: version
        run: |
          PATCHES="$GITHUB_WORKSPACE/patches"
          # Bleeding edge: dxvk MASTER + Ph42oN gplasync (master) + leegao binary-semaphore
          # patch layered on top. COMPILE guard: PROVE the fully-patched tree builds; only if
          # it fails to APPLY or COMPILE fall back to v3.0 + gplasync-3.0-1 (+ binsem) so the
          # nightly still ships. The BinSem patch is applied in BOTH the master and fallback
          # paths (touches dxvk_cmdlist/dxvk_queue only — no overlap with gplasync).

          # Job-specific COMPILE recipe (package-release.sh propagates ninja failure as non-zero).
          build_dxvk() {
            cd "$GITHUB_WORKSPACE/dxvk" || return 1
            # Use all available vCPUs (runners have 4; was hardcoded to 2)
            sed -i 's/\bninja\b/ninja -j$(nproc)/g' package-release.sh \
              && ./package-release.sh master ../dxvk-built --no-package
          }

          # Try upstream MASTER + master gplasync + binsem patches and PROVE IT COMPILES.
          # Returns non-zero if any patch fails to APPLY or the tree fails to COMPILE.
          attempt_master() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            git fetch --tags --force >/dev/null 2>&1 || true
            # patch --fuzz (not git apply): tolerates minor context drift vs a moving master.
            patch -p1 --fuzz=3 --dry-run < "$PATCHES/dxvk-gplasync-master.patch" >/dev/null 2>&1 || return 1
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-master.patch" || return 1
            # leegao binary-semaphore fallback (vendored) — layered on top of gplasync.
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-binary-semaphores.patch" || return 1
            build_dxvk || return 1
          }

          # Pinned known-good fallback: v3.0 + gplasync-3.0-1 + binsem. Fatal if it fails.
          use_fallback() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules --branch v3.0 \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-3.0-1.patch"
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-binary-semaphores.patch"
            build_dxvk
          }

          if attempt_master; then
            echo "DXVK master patched tree built OK"
          else
            echo "::warning::DXVK master gplasync patch failed to APPLY or COMPILE — falling back to pinned v3.0 + gplasync-3.0-1. Re-vendor patches/dxvk-gplasync-master.patch from Ph42oN."
            use_fallback
          fi

          # Version reflects whichever tree actually built (master, or the v3.0 fallback).
          cd "$GITHUB_WORKSPACE/dxvk"
          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="${LATEST_TAG}-binsem-gplasync-${COMMIT_HASH}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package
        run: |
          mkdir -p packaging
          cp -r dxvk-built/dxvk-master/x64 packaging/system32
          cp -r dxvk-built/dxvk-master/x32 packaging/syswow64

          cat <<EOF > packaging/profile.json
          {
            "type": "DXVK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 0,
            "description": "Banners Repo - Binary Semaphores + GPLAsync (Upstream: Philip Rebohle, GPLAsync: Ph42oN, BinSem: leegao). Set DXVK_DISABLE_TIMELINE_SEMAPHORES=1 to enable the fallback.",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF

          # WCP
          tar -cJf DXVK-${{ env.VERSION_NAME }}.wcp -C packaging .

          # ZIP
          cd packaging
          zip -r ../DXVK-${{ env.VERSION_NAME }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-binsem-standard
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 8: DXVK Binary-Semaphores (ARM64EC, GPLAsync)
  # ARM64EC counterpart of JOB 7 — same cross-build recipe as JOB 6 plus
  # the gplasync + leegao binary-semaphore patches layered on top.
  # ==================================================================
  build-dxvk-binsem-arm64ec:
    name: Build DXVK BinSem (ARM64EC)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout (for patch file)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl xz-utils jq git build-essential \
            python3 pkg-config zstd meson ninja-build wget unzip zip ccache patch

      - name: Get DXVK Upstream Commit
        id: dxvk-hash
        run: |
          HASH=$(git ls-remote https://github.com/doitsujin/dxvk.git HEAD | cut -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key tied to exact upstream commit — auto-busts when DXVK has new commits
          key: ccache-dxvk-binsem-arm64ec-${{ steps.dxvk-hash.outputs.hash }}
          restore-keys: ccache-dxvk-binsem-arm64ec-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Cache LLVM-MinGW
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          # Version-pinned — only re-downloads if you bump the tag below
          key: llvm-mingw-20251104-ubuntu22

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup LLVM-MinGW
        run: |
          if [ ! -d "/opt/llvm-mingw/bin" ]; then
            echo "Cache miss — downloading LLVM-MinGW..."
            LLVM_MINGW_TAG="20251104"
            wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
            sudo mkdir -p /opt/llvm-mingw
            sudo tar -C /opt/llvm-mingw --strip-components=1 -xJf llvm.tar.xz
          else
            echo "Cache hit — LLVM-MinGW ready."
          fi
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache --zero-stats

      - name: Configure Cross-Files
        run: |
          # ccache injected via the binaries array — cleanest approach for meson cross builds
          cat <<EOF > arm64ec.txt
          [binaries]
          c = ['ccache', 'arm64ec-w64-mingw32-clang']
          cpp = ['ccache', 'arm64ec-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'arm64ec-w64-mingw32-windres'
          widl = 'arm64ec-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          cat <<EOF > x86.txt
          [binaries]
          c = ['ccache', 'i686-w64-mingw32-clang']
          cpp = ['ccache', 'i686-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'i686-w64-mingw32-windres'
          widl = 'i686-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

      - name: Build
        id: version
        run: |
          PATCHES="$GITHUB_WORKSPACE/patches"
          # Bleeding edge: dxvk MASTER + Ph42oN gplasync (master) + leegao binary-semaphore
          # patch layered on top. COMPILE guard: PROVE the fully-patched tree builds; only if
          # it fails to APPLY or COMPILE fall back to v3.0 + gplasync-3.0-1 (+ binsem) so the
          # nightly still ships. The BinSem patch is applied in BOTH the master and fallback
          # paths (touches dxvk_cmdlist/dxvk_queue only — no overlap with gplasync). Cross files
          # were written into $GITHUB_WORKSPACE by the preceding "Configure Cross-Files" step.

          # Job-specific COMPILE recipe (meson + ninja cross-build; ../*.txt from Configure Cross-Files).
          build_dxvk() {
            cd "$GITHUB_WORKSPACE/dxvk" || return 1
            meson setup build-ec --cross-file ../arm64ec.txt -Dbuildtype=release -Dstrip=true \
              && meson setup build-x86 --cross-file ../x86.txt -Dbuildtype=release -Dstrip=true \
              && ninja -C build-ec -j$(nproc) \
              && ninja -C build-x86 -j$(nproc)
          }

          # Try upstream MASTER + master gplasync + binsem patches and PROVE IT COMPILES.
          # Returns non-zero if any patch fails to APPLY or the tree fails to COMPILE.
          attempt_master() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            git fetch --tags --force >/dev/null 2>&1 || true
            # patch --fuzz (not git apply): tolerates minor context drift vs a moving master.
            patch -p1 --fuzz=3 --dry-run < "$PATCHES/dxvk-gplasync-master.patch" >/dev/null 2>&1 || return 1
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-master.patch" || return 1
            # leegao binary-semaphore fallback (vendored) — layered on top of gplasync.
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-binary-semaphores.patch" || return 1
            build_dxvk || return 1
          }

          # Pinned known-good fallback: v3.0 + gplasync-3.0-1 + binsem. Fatal if it fails.
          use_fallback() {
            cd "$GITHUB_WORKSPACE"; rm -rf dxvk dxvk-built build-ec build-x86
            git clone --recurse-submodules --shallow-submodules --branch v3.0 \
              https://github.com/doitsujin/dxvk.git dxvk
            cd dxvk
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-gplasync-3.0-1.patch"
            patch -p1 --fuzz=3 < "$PATCHES/dxvk-binary-semaphores.patch"
            build_dxvk
          }

          if attempt_master; then
            echo "DXVK master patched tree built OK"
          else
            echo "::warning::DXVK master gplasync patch failed to APPLY or COMPILE — falling back to pinned v3.0 + gplasync-3.0-1. Re-vendor patches/dxvk-gplasync-master.patch from Ph42oN."
            use_fallback
          fi

          # Version reflects whichever tree actually built (master, or the v3.0 fallback).
          cd "$GITHUB_WORKSPACE/dxvk"
          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="${LATEST_TAG}-binsem-gplasync-arm64ec-${COMMIT_HASH}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package
        run: |
          mkdir -p packaging/system32
          mkdir -p packaging/syswow64

          copy_dll() {
            SRC_DIR=$1
            DEST_DIR=$2
            cp "dxvk/$SRC_DIR/src/d3d11/d3d11.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d10/d3d10core.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d9/d3d9.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d8/d3d8.dll" "$DEST_DIR/" || true
            cp "dxvk/$SRC_DIR/src/dxgi/dxgi.dll" "$DEST_DIR/"
          }
          copy_dll "build-ec" "packaging/system32"
          copy_dll "build-x86" "packaging/syswow64"
          llvm-strip --strip-all packaging/system32/*.dll
          llvm-strip --strip-all packaging/syswow64/*.dll

          cat <<EOF > packaging/profile.json
          {
            "type": "DXVK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 0,
            "description": "Banners Repo - Binary Semaphores + GPLAsync ARM64EC (Upstream: Philip Rebohle, GPLAsync: Ph42oN, BinSem: leegao). Set DXVK_DISABLE_TIMELINE_SEMAPHORES=1 to enable the fallback.",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF

          cd packaging

          # WCP
          tar --zstd -cf ../DXVK-${{ env.VERSION_NAME }}.wcp .

          # ZIP
          zip -r ../DXVK-${{ env.VERSION_NAME }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-binsem-arm64ec
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 8c: D7VK (DirectDraw / Direct3D 7·6·5·3 -> Vulkan)
  # WinterSnowfall/d7vk — a DXVK spin-off that ships ONLY ddraw.dll.
  # 32-bit ONLY: its package-release.sh defaults to opt_32_only=1, and every
  # DirectDraw/D3D7 title is 32-bit. ddraw.dll statically links d7vk's own
  # d3d9 backend, so it is self-contained and does NOT touch the container's
  # DXVK d3d9/d3d11/dxgi — it occupies the independent `ddraw` wrapper slot.
  # Publishes: a .tzst (exact bundled-asset layout: syswow64/ddraw.dll, to
  # refresh assets/ddrawrapper/d7vk.tzst in the app) PLUS a .wcp + .zip for
  # manual / Winlator install.
  # ==================================================================
  build-d7vk:
    name: Build D7VK (DirectDraw/D3D7)
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wget git xz-utils zstd python3 meson ninja-build build-essential unzip zip ccache

      - name: Get D7VK Upstream Commit
        id: d7vk-hash
        # Track the `devel` branch specifically — that is d7vk's 2.x PRODUCT line
        # (latest v2.x tags live there). `master` is a separate DXVK-3.0.2 rebase
        # line we deliberately do NOT ship.
        run: echo "hash=$(git ls-remote https://github.com/WinterSnowfall/d7vk.git refs/heads/devel | cut -f1)" >> $GITHUB_OUTPUT

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key tied to exact upstream commit — auto-busts when d7vk has new commits
          key: ccache-d7vk-${{ steps.d7vk-hash.outputs.hash }}
          restore-keys: ccache-d7vk-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup ccache compiler wrappers
        run: |
          mkdir -p ~/ccache-bin
          for compiler in \
            x86_64-w64-mingw32-gcc \
            x86_64-w64-mingw32-g++ \
            i686-w64-mingw32-gcc \
            i686-w64-mingw32-g++; do
            ln -s "$(which ccache)" ~/ccache-bin/$compiler
          done
          echo "$HOME/ccache-bin" >> $GITHUB_PATH
          ccache --max-size=1G
          ccache --zero-stats

      - name: Build D7VK (master HEAD)
        id: version
        run: |
          set -e
          # Build the d7vk 2.x PRODUCT line (latest commits) from the `devel`
          # branch. IMPORTANT: `devel` carries the v2.x tags (latest = v2.1) and
          # is what we ship. The separate `master` branch is a DXVK-3.0.2 rebase
          # line (its v3.0.2 tag + meson `version:'3.0.2'` are the *DXVK base*, not
          # the d7vk product version) — we deliberately do NOT build it.
          git clone --recurse-submodules --shallow-submodules --branch devel \
            https://github.com/WinterSnowfall/d7vk.git d7vk
          cd d7vk
          git fetch --tags --force >/dev/null 2>&1 || true

          # ── GCC/mingw-w64 compat shim ──────────────────────────────────
          # Upstream's cross-files target GCC, but devel occasionally uses the
          # clang-friendly `std::sqrtf`, which libstdc++ on mingw-w64 does NOT
          # expose in namespace std (GCC-vs-Clang divergence). Rewrite to
          # `std::sqrt` — its float overload gives an identical float-precision
          # result — so the bleeding-edge tree still builds with GCC. No-op when
          # upstream isn't using std::sqrtf.
          apply_gcc_shim() { grep -rl 'std::sqrtf' src 2>/dev/null | xargs -r sed -i 's/std::sqrtf/std::sqrt/g'; }
          apply_gcc_shim
          # package-release.sh calls bare `ninja` — use all vCPUs.
          sed -i 's/\bninja\b/ninja -j$(nproc)/g' package-release.sh

          # LATEST_TAG on devel = the newest d7vk product tag (v2.1 now, v2.2 later).
          # Nightly label = "<tag>-<commit>-nightly", e.g. v2.1-bc3b29b9e-nightly.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "d7vk")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          # First arg to package-release.sh is only a folder label -> d7vk-nightly/.
          if ./package-release.sh nightly ../d7vk-built --no-package; then
            echo "Built d7vk devel (${LATEST_TAG} @ ${COMMIT_HASH})"
            VERSION_NAME="${LATEST_TAG}-${COMMIT_HASH}-nightly"
          else
            # If devel still fails to build with GCC (some other upstream breakage
            # the shim can't absorb), fall back to the last product tag so the
            # nightly always ships — same philosophy as the DXVK job.
            echo "::warning::d7vk devel (${COMMIT_HASH}) failed to build with GCC/mingw even after the std::sqrtf shim; falling back to last product tag ${LATEST_TAG}."
            cd ..
            rm -rf d7vk d7vk-built
            git clone --recurse-submodules --shallow-submodules --branch "$LATEST_TAG" \
              https://github.com/WinterSnowfall/d7vk.git d7vk
            cd d7vk
            apply_gcc_shim
            sed -i 's/\bninja\b/ninja -j$(nproc)/g' package-release.sh
            COMMIT_HASH=$(git rev-parse --short HEAD)
            # Fallback built the actual product tag — no -nightly marker.
            VERSION_NAME="${LATEST_TAG}"
            ./package-release.sh nightly ../d7vk-built --no-package
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package
        run: |
          NAME="d7vk-${{ env.VERSION_NAME }}"   # e.g. d7vk-v2.1-bc3b29b9e-nightly
          # package-release.sh built into d7vk-nightly/; at 32-bit-only, x32/ holds
          # ddraw.dll (+ d3d9.dll, which we DROP — the container keeps its own
          # DXVK d3d9; d7vk's ddraw statically links its own copy anyway).
          SRC="d7vk-built/d7vk-nightly/x32"
          echo "Built files:"; ls -la "$SRC"

          # ---- (1) .tzst — exact bundled-asset format the app consumes ------
          # XServerDisplayActivity extracts ddrawrapper/d7vk.tzst expecting
          # syswow64/ddraw.dll. Rename this to d7vk.tzst to refresh the APK asset.
          mkdir -p tzstroot/syswow64
          cp "$SRC/ddraw.dll" tzstroot/syswow64/ddraw.dll
          tar --zstd -cf "${NAME}.tzst" -C tzstroot .

          # ---- (2) .wcp + .zip — manual / Winlator install -----------------
          mkdir -p packaging/syswow64
          cp "$SRC/ddraw.dll" packaging/syswow64/ddraw.dll
          cat <<EOF > packaging/profile.json
          {
            "type": "D7VK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": 0,
            "description": "D7VK — DirectDraw/Direct3D 7 (Upstream: WinterSnowfall)",
            "files": [
              { "source": "syswow64/ddraw.dll", "target": "\${syswow64}/ddraw.dll" }
            ]
          }
          EOF
          # WCP (xz, matching the flagship DXVK job)
          tar -cJf "${NAME}.wcp" -C packaging .
          # ZIP
          cd packaging
          zip -r "../${NAME}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: d7vk-nightly
          path: |
            *.wcp
            *.zip
            *.tzst

  # ==================================================================
  # JOB 8b: DXVK Vanilla (Standard x64/x86)
  # Clean upstream doitsujin/dxvk stable release, NO patches (no gplasync,
  # no binsem). Repackaged straight from the official release tarball —
  # upstream already ships stripped x64/x32 DLLs, so nothing is compiled
  # here. Pins to the latest published DXVK release.
  # ==================================================================
  build-dxvk-vanilla:
    name: Build DXVK Vanilla (Standard)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl xz-utils jq zip tar

      - name: Resolve latest DXVK release + fetch tarball
        id: ver
        run: |
          TAG=$(gh api repos/doitsujin/dxvk/releases/latest --jq '.tag_name')
          VER="${TAG#v}"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "Latest upstream DXVK release: $TAG (version $VER)"
          gh release download "$TAG" -R doitsujin/dxvk -p "dxvk-${VER}.tar.gz" --clobber
          tar -xzf "dxvk-${VER}.tar.gz"

      - name: Package (clean vanilla naming)
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          rm -rf packaging
          mkdir -p packaging
          cp -r "dxvk-${VER}/x64" packaging/system32
          cp -r "dxvk-${VER}/x32" packaging/syswow64
          cat > packaging/profile.json <<EOF
          {
            "type": "DXVK",
            "versionName": "v${VER}",
            "versionCode": 0,
            "description": "DXVK ${VER} (Upstream: Philip Rebohle). Vanilla upstream release, no patches.",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF
          # WCP (xz, matching the flagship DXVK job)
          tar -cJf "DXVK-v${VER}.wcp" -C packaging .
          # ZIP
          ( cd packaging && zip -r "../DXVK-v${VER}.zip" . )
          ls -la "DXVK-v${VER}.wcp" "DXVK-v${VER}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-vanilla
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 8c: DXVK Vanilla (ARM64EC)
  # Clean upstream doitsujin/dxvk stable release cross-compiled for
  # ARM64EC, NO patches. Upstream ships no ARM64EC binaries, so this is
  # source-compiled (recipe mirrors the ARM64EC gplasync job minus the
  # patches). Pins to the latest published DXVK release.
  # ==================================================================
  build-dxvk-arm64ec-vanilla:
    name: Build DXVK Vanilla (ARM64EC)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl xz-utils jq git build-essential \
            python3 pkg-config zstd meson ninja-build wget unzip zip ccache

      - name: Resolve latest DXVK release
        id: ver
        run: |
          TAG=$(gh api repos/doitsujin/dxvk/releases/latest --jq '.tag_name')
          VER="${TAG#v}"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "Latest upstream DXVK release: $TAG (version $VER)"

      - name: Get week number (for glslang cache key)
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-dxvk-vanilla-ec-${{ steps.ver.outputs.ver }}
          restore-keys: ccache-dxvk-vanilla-ec-

      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v4
        with:
          path: glslang
          key: glslang-master-tot-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: glslang-master-tot-${{ runner.os }}-

      - name: Cache LLVM-MinGW
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-20251104-ubuntu22

      - name: Download glslang
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -qo glslang-master-linux-Release.zip -d glslang

      - name: Add glslang to PATH
        run: echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup LLVM-MinGW
        run: |
          if [ ! -d "/opt/llvm-mingw/bin" ]; then
            echo "Cache miss — downloading LLVM-MinGW..."
            LLVM_MINGW_TAG="20251104"
            wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
            sudo mkdir -p /opt/llvm-mingw
            sudo tar -C /opt/llvm-mingw --strip-components=1 -xJf llvm.tar.xz
          else
            echo "Cache hit — LLVM-MinGW ready."
          fi
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          ccache --max-size=1G
          ccache --zero-stats

      - name: Clone DXVK (vanilla, no patches)
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          git clone --branch "v${VER}" --recurse-submodules \
            https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure Cross-Files
        run: |
          cat <<EOF > arm64ec.txt
          [binaries]
          c = ['ccache', 'arm64ec-w64-mingw32-clang']
          cpp = ['ccache', 'arm64ec-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'arm64ec-w64-mingw32-windres'
          widl = 'arm64ec-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          cat <<EOF > x86.txt
          [binaries]
          c = ['ccache', 'i686-w64-mingw32-clang']
          cpp = ['ccache', 'i686-w64-mingw32-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = 'i686-w64-mingw32-windres'
          widl = 'i686-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

      - name: Build
        run: |
          cd dxvk
          meson setup build-ec --cross-file ../arm64ec.txt -Dbuildtype=release -Dstrip=true
          meson setup build-x86 --cross-file ../x86.txt -Dbuildtype=release -Dstrip=true
          ninja -C build-ec -j$(nproc)
          ninja -C build-x86 -j$(nproc)

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Package (clean vanilla naming)
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          copy_dll() {
            SRC_DIR=$1; DEST_DIR=$2
            cp "dxvk/$SRC_DIR/src/d3d11/d3d11.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d10/d3d10core.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d9/d3d9.dll" "$DEST_DIR/"
            cp "dxvk/$SRC_DIR/src/d3d8/d3d8.dll" "$DEST_DIR/" || true
            cp "dxvk/$SRC_DIR/src/dxgi/dxgi.dll" "$DEST_DIR/"
          }
          rm -rf packaging; mkdir -p packaging/system32 packaging/syswow64
          copy_dll "build-ec" "packaging/system32"
          copy_dll "build-x86" "packaging/syswow64"
          llvm-strip --strip-all packaging/system32/*.dll
          llvm-strip --strip-all packaging/syswow64/*.dll
          cat > packaging/profile.json <<EOF
          {
            "type": "DXVK",
            "versionName": "v${VER}-arm64ec",
            "versionCode": 0,
            "description": "DXVK ${VER} ARM64EC (Upstream: Philip Rebohle). Vanilla upstream release, no patches.",
            "files": [
              { "source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll" },
              { "source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll" },
              { "source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll" },
              { "source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll" },
              { "source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll" },
              { "source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll" },
              { "source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll" },
              { "source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll" },
              { "source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll" },
              { "source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll" }
            ]
          }
          EOF
          ( cd packaging && ZSTD_CLEVEL=19 tar --zstd -cf "../DXVK-v${VER}-arm64ec.wcp" profile.json system32 syswow64 )
          ( cd packaging && zip -r "../DXVK-v${VER}-arm64ec.zip" profile.json system32 syswow64 )
          echo "packaged DXVK-v${VER}-arm64ec.wcp (commit ${COMMIT})"
          ls -la "DXVK-v${VER}-arm64ec.wcp"

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-arm64ec-vanilla
          path: |
            *.wcp
            *.zip

  # ==================================================================
  # JOB 9: Release
  # ==================================================================
  create-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    # Only publish/refresh nightly-latest from the default branch. Feature-branch
    # workflow_dispatch runs still build every job (validating the build) but never
    # publish a release or clobber the production nightly-latest that clients pull.
    if: github.ref == 'refs/heads/main'
    needs: [build-box64-matrix, build-fex, build-fex-ppa, repack-fex-ppa-official, build-vkd3d, build-dxvk, build-vkd3d-arm64ec, build-dxvk-arm64ec, build-dxvk-binsem, build-dxvk-binsem-arm64ec, build-d7vk, build-dxvk-vanilla, build-dxvk-arm64ec-vanilla]
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Download Latest Banners-Turnip Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./artifacts
          TURNIP_INFO=$(gh release view --repo The412Banner/Banners-Turnip --json tagName,name)
          TURNIP_TAG=$(echo "$TURNIP_INFO" | jq -r '.tagName')
          TURNIP_NAME=$(echo "$TURNIP_INFO" | jq -r '.name')
          echo "TURNIP_TAG=$TURNIP_TAG" >> $GITHUB_ENV
          echo "TURNIP_NAME=$TURNIP_NAME" >> $GITHUB_ENV
          gh release download "$TURNIP_TAG" \
            --repo The412Banner/Banners-Turnip \
            --pattern "Turnip-*.zip" \
            --dir ./artifacts
          echo "Downloaded Turnip release: $TURNIP_TAG ($TURNIP_NAME)"

      - name: Set Release Variables
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          READABLE_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          echo "TAG_NAME=nightly-$TIMESTAMP" >> $GITHUB_ENV
          echo "RELEASE_NAME=Emulation Nightly Build - $READABLE_DATE" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # Delete nightly releases older than 24 hours.
      # Uses the GitHub API to list all releases, filters to those whose
      # tag starts with "nightly-", checks the published_at timestamp,
      # and deletes both the release and its git tag if older than 24h.
      # Runs before creating the new release so we never briefly have
      # zero releases visible.
      # ----------------------------------------------------------------
      - name: Delete old nightly releases
        run: |
          CUTOFF=$(date -u -d '24 hours ago' +%s)
          PAGE=1

          while true; do
            # Fetch one page of releases (100 per page max)
            RELEASES=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$PAGE")

            # Stop if the page is empty
            COUNT=$(echo "$RELEASES" | jq length)
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            # Iterate over each release on this page
            echo "$RELEASES" | jq -c '.[]' | while read -r RELEASE; do
              TAG=$(echo "$RELEASE" | jq -r '.tag_name')
              RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
              PUBLISHED=$(echo "$RELEASE" | jq -r '.published_at')

              # Only touch releases made by this workflow (tag starts with "nightly-")
              if [[ "$TAG" != nightly-* ]]; then
                continue
              fi

              # Skip draft releases (published_at is null)
              if [ "$PUBLISHED" = "null" ] || [ -z "$PUBLISHED" ]; then
                echo "Skipping draft release: $TAG"
                continue
              fi

              # Convert published_at to epoch seconds and compare
              PUBLISHED_EPOCH=$(date -u -d "$PUBLISHED" +%s)
              if [ "$PUBLISHED_EPOCH" -lt "$CUTOFF" ]; then
                echo "Deleting release: $TAG (published $PUBLISHED)"

                # Delete the release
                curl -s -X DELETE \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"

                # Delete the associated git tag
                curl -s -X DELETE \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG"

                echo "Deleted: $TAG"
              else
                echo "Keeping: $TAG (published $PUBLISHED, within 24h)"
              fi
            done

            PAGE=$((PAGE + 1))
          done

      - name: Build Release Body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEX_VERSION: ${{ needs.build-fex.outputs.version }}
          FEX_COMMIT: ${{ needs.build-fex.outputs.commit }}
          VKD3D_VERSION: ${{ needs.build-vkd3d.outputs.version }}
          VKD3D_COMMIT: ${{ needs.build-vkd3d.outputs.commit }}
          VKD3D_ARM64EC_VERSION: ${{ needs.build-vkd3d-arm64ec.outputs.version }}
          VKD3D_ARM64EC_COMMIT: ${{ needs.build-vkd3d-arm64ec.outputs.commit }}
          DXVK_COMMIT: ${{ needs.build-dxvk.outputs.commit }}
          DXVK_VERSION: ${{ needs.build-dxvk.outputs.version }}
          DXVK_ARM64EC_VERSION: ${{ needs.build-dxvk-arm64ec.outputs.version }}
          DXVK_ARM64EC_COMMIT: ${{ needs.build-dxvk-arm64ec.outputs.commit }}
          DXVK_BINSEM_VERSION: ${{ needs.build-dxvk-binsem.outputs.version }}
          DXVK_BINSEM_COMMIT: ${{ needs.build-dxvk-binsem.outputs.commit }}
          DXVK_BINSEM_ARM64EC_VERSION: ${{ needs.build-dxvk-binsem-arm64ec.outputs.version }}
          DXVK_BINSEM_ARM64EC_COMMIT: ${{ needs.build-dxvk-binsem-arm64ec.outputs.commit }}
          D7VK_VERSION: ${{ needs.build-d7vk.outputs.version }}
          D7VK_COMMIT: ${{ needs.build-d7vk.outputs.commit }}
        run: |
          REPOS=(
            "ptitSeb/box64"
            "Pipetto-crypto/box64"
            "FEX-Emu/FEX"
            "HansKristian-Work/vkd3d-proton"
            "doitsujin/dxvk"
            "WinterSnowfall/d7vk"
            "The412Banner/Banners-Turnip"
          )
          NAMES=(
            "Box64 (Official)"
            "Box64 (Hybrid/Pipetto)"
            "FEX"
            "VKD3D-Proton"
            "DXVK"
            "D7VK (DDraw/D3D7)"
            "Turnip (Banners)"
          )

          CUTOFF_24H=$(date -u -d '24 hours ago' +%s)

          # ── Fetch current status for all upstreams ──────────────────────
          STATUS_TABLE="<details><summary>📊 <b>All upstream component status</b></summary>\n\n| Component | Latest Commit | Last Updated |\n| :--- | :--- | :--- |\n"

          for i in "${!REPOS[@]}"; do
            REPO="${REPOS[$i]}"
            NAME="${NAMES[$i]}"
            INFO=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/HEAD")
            HASH=$(echo "$INFO" | jq -r '.sha // "unknown"')
            SHORT="${HASH:0:7}"
            MSG=$(echo "$INFO" | jq -r '.commit.message // "N/A"' | head -1 | cut -c1-72)
            DATE=$(echo "$INFO" | jq -r '.commit.committer.date // "unknown"')
            DISPLAY_DATE=$(echo "$DATE" | cut -c1-10)

            # Mark with 🆕 if updated in last 24 hours
            DATE_EPOCH=$(date -u -d "$DATE" +%s 2>/dev/null || echo 0)
            if [ "$DATE_EPOCH" -gt "$CUTOFF_24H" ]; then
              BADGE=" 🆕"
            else
              BADGE=""
            fi

            STATUS_TABLE="${STATUS_TABLE}| **${NAME}** | [\`${SHORT}\` — ${MSG}](https://github.com/${REPO}/commit/${HASH}) | ${DISPLAY_DATE}${BADGE} |\n"
          done

          # ── What triggered this build (from upstream_changes.json) ──────
          TRIGGER_SECTION=""
          if [ -f "upstream_changes.json" ]; then
            CHANGED_COUNT=$(jq '.changed | length' upstream_changes.json)
            TRIGGERED_AT=$(jq -r '.triggered_at' upstream_changes.json)
            TRIGGERED_EPOCH=$(date -u -d "$TRIGGERED_AT" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            AGE=$(( NOW_EPOCH - TRIGGERED_EPOCH ))

            # Only show "what changed" section if watcher ran within the last 3 hours
            # (avoids stale data from a previous watcher run on scheduler-triggered builds)
            if [ "$CHANGED_COUNT" -gt "0" ] && [ "$AGE" -lt "10800" ]; then
              TRIGGER_SECTION="### 🔄 What changed\n> ${CHANGED_COUNT} upstream component(s) updated since last build\n\n| Component | Old Commit | New Commit | Change |\n| :--- | :--- | :--- | :--- |\n"
              while IFS= read -r row; do
                R_NAME=$(echo "$row" | jq -r '.name')
                R_REPO=$(echo "$row" | jq -r '.repo')
                R_OLD=$(echo "$row" | jq -r '.old')
                R_NEW=$(echo "$row" | jq -r '.new')
                R_FULL=$(echo "$row" | jq -r '.full')
                R_MSG=$(echo "$row" | jq -r '.msg' | cut -c1-72)
                TRIGGER_SECTION="${TRIGGER_SECTION}| **${R_NAME}** | \`${R_OLD}\` | [\`${R_NEW}\`](https://github.com/${R_REPO}/commit/${R_FULL}) | ${R_MSG} |\n"
              done < <(jq -c '.changed[]' upstream_changes.json)
              TRIGGER_SECTION="${TRIGGER_SECTION}\n---\n\n"
            fi
          fi

          # ── Write the full release body ─────────────────────────────────
          cat > release_body.md << BODYEOF
          > ⚠️ **Nightly build — not always stable. Use at your own risk; stable releases are best.**

          ---

          ## 🚀 Nightly Build: ${{ env.TAG_NAME }}

          BODYEOF

          # Append trigger section if present
          if [ -n "$TRIGGER_SECTION" ]; then
            printf "%b\n" "$TRIGGER_SECTION" >> release_body.md
          fi

          # Append upstream status table (wrapped in a collapsed <details>)
          printf "%b\n</details>\n\n" "$STATUS_TABLE" >> release_body.md

          # Append built component versions table + files list
          cat >> release_body.md << BODYEOF
          ---

          <details><summary>📦 <b>Built components</b></summary>

          | Component | Source / Commit |
          | :--- | :--- |
          | **Box64 (All Variants)** | [ptitSeb/main](https://github.com/ptitSeb/box64/commits/main) |
          | **Box64 Hybrid (All Variants)** | [Pipetto/main](https://github.com/Pipetto-crypto/box64/commits/main) |
          | **FEXCore** | [${FEX_VERSION}](https://github.com/FEX-Emu/FEX/commit/${FEX_COMMIT}) |
          | **VKD3D-Proton (Std)** | [${VKD3D_VERSION}](https://github.com/HansKristian-Work/vkd3d-proton/commit/${VKD3D_COMMIT}) |
          | **VKD3D-Proton (ARM64EC)** | [${VKD3D_ARM64EC_VERSION}](https://github.com/HansKristian-Work/vkd3d-proton/commit/${VKD3D_ARM64EC_COMMIT}) |
          | **DXVK (GPLAsync)** | [${DXVK_COMMIT}](https://github.com/doitsujin/dxvk/commit/${DXVK_COMMIT}) |
          | **DXVK (ARM64EC)** | [${DXVK_ARM64EC_VERSION}](https://github.com/doitsujin/dxvk/commit/${DXVK_ARM64EC_COMMIT}) |
          | **DXVK BinSem (GPLAsync)** | [${DXVK_BINSEM_VERSION}](https://github.com/doitsujin/dxvk/commit/${DXVK_BINSEM_COMMIT}) |
          | **DXVK BinSem (ARM64EC)** | [${DXVK_BINSEM_ARM64EC_VERSION}](https://github.com/doitsujin/dxvk/commit/${DXVK_BINSEM_ARM64EC_COMMIT}) |
          | **D7VK (DDraw/D3D7)** | [${D7VK_VERSION}](https://github.com/WinterSnowfall/d7vk/commit/${D7VK_COMMIT}) |
          | **Turnip (A6xx/A7xx/A8xx)** | [${TURNIP_NAME}](https://github.com/The412Banner/Banners-Turnip/releases/tag/${TURNIP_TAG}) |

          </details>

          <details><summary>📁 <b>Files included</b> — what each .wcp / .zip is</summary>

          1. **Box64 Native**: \`Box64-*-Native.wcp\` (and \`.zip\`)
          2. **Box64 Bionic**: \`Box64-*-Bionic.wcp\` (and \`.zip\`)
          3. **WOWBox64**: \`WOWBox64-*.wcp\` (and \`.zip\`)
          4. **Box64 Hybrid Native**: \`Box64-*-Hybrid-*-Native.wcp\` (and \`.zip\`)
          5. **Box64 Hybrid Bionic**: \`Box64-*-Hybrid-*-Bionic.wcp\` (and \`.zip\`)
          6. **WOWBox64 Hybrid**: \`WOWBox64-*-Hybrid-*.wcp\` (and \`.zip\`)
          7. **FEXCore**: \`FEX-*.wcp\` (and \`.zip\`)
          7b. **FEXCore PPA-flavor**: \`FEX-*-PPA.wcp\` (and \`.zip\`) — same FEX HEAD, built with \`bylaws/llvm-mingw 20250920\` and the calibrated PPA recipe (Release + C-only debug info, \`//fex-emu/HostThunks\` baked, \`versionCode=0\`, \`description="FEXCore Release from PPA"\`). Calibrated to land within −0.16% of the upstream PPA wcp.
          7c. **FEXCore +unix libs**: \`FEX-*-unix.wcp\` — the FEX DLLs **plus** the native aarch64 \`.so\` unixlib companions (\`libarm64ecfex.so\`/\`libwow64fex.so\`, shm-stubbed, executable). Requires a Proton built with the FEX unixlib loader (Proton 11.0-1+ with \`MemoryWineLoadUnixLibByName\`); on older Proton the \`.so\` is ignored and it runs DLL-only.
          7d. **FEXCore PPA +unix libs**: \`FEX-*-PPA-unix.wcp\` — same \`.so\` unixlib companions paired with the PPA-flavor (bylaws / DWARF) DLLs.
          7e. **FEXCore Official PPA (genuine upstream)**: \`FEXCore-*-official-ppa.wcp\` — the real \`fex-emu-wine\` DLLs pulled straight from the FEX-Emu Launchpad PPA \`.deb\` and repackaged **byte-for-byte** (NOT a rebuild — this is upstream's own shipped file). Only appears for a stable release whose \`.deb\` is currently published on the PPA.
          7f. **FEXCore Official PPA +unix libs**: \`FEXCore-*-official-ppa-unix.wcp\` — those genuine upstream DLLs paired with the bionic \`.so\` unixlib companions. The DLLs are upstream's; the \`.so\` is our host shim (upstream ships no unix lib).
          8. **VKD3D-Proton (Std)**: \`VKD3D-Proton-${VKD3D_VERSION}.wcp\` (and \`.zip\`)
          9. **VKD3D-Proton (ARM64EC)**: \`VKD3D-Proton-${VKD3D_ARM64EC_VERSION}.wcp\` (and \`.zip\`)
          10. **DXVK**: \`dxvk-gplasync-*.wcp\` (and \`.zip\`)
          11. **DXVK (ARM64EC)**: \`DXVK-ARM64EC-*.wcp\` (and \`.zip\`)
          12. **DXVK BinSem (GPLAsync)**: \`DXVK-*-binsem-gplasync-*.wcp\` (and \`.zip\`) — adds the \`DXVK_DISABLE_TIMELINE_SEMAPHORES=1\` runtime fallback (Turnip-kgsl timeline-semaphore FPS workaround)
          13. **DXVK BinSem (ARM64EC)**: \`DXVK-*-binsem-gplasync-arm64ec-*.wcp\` (and \`.zip\`)
          14. **D7VK (DDraw/D3D7)**: \`d7vk-*.tzst\` + \`d7vk-*.wcp\` (and \`.zip\`) — DirectDraw / Direct3D 7·6·5·3 → Vulkan (WinterSnowfall/d7vk, master). Ships **only** a 32-bit \`syswow64/ddraw.dll\`; occupies the **DDraw Wrapper** slot (independent of DXVK/VKD3D). The **\`.tzst\`** is the drop-in refresh for the app's bundled \`assets/ddrawrapper/d7vk.tzst\` (rename to \`d7vk.tzst\`); the \`.wcp\`/\`.zip\` are for manual / Winlator install.
          15. **Turnip GPU Driver**: \`Turnip-v*.zip\` — latest release from [Banners-Turnip](https://github.com/The412Banner/Banners-Turnip/releases), Adreno A6xx/A7xx/A8xx, KGSL

          </details>

          <details><summary>⚙️ <b>DXVK BinSem fallback</b> — how to enable</summary>

          The **DXVK BinSem** builds (\`*-binsem-gplasync-*\`) ship leegao's [binary-semaphore queue fallback](https://github.com/leegao/dxvk/commit/e950b4a90359acebf13f5a76cfa2cfaa7c238b74) on top of the usual GPLAsync patch. The fallback is **opt-in** — set the environment variable in your container/Wine environment:

          \`\`\`
          DXVK_DISABLE_TIMELINE_SEMAPHORES=1
          \`\`\`

          This restores binary-semaphore inter-queue sync and works around the Turnip-kgsl timeline-semaphore FPS regression in DXVK 2.5+. **Without the variable set, these DLLs behave like stock DXVK**, so the BinSem builds are safe drop-in replacements either way.

          </details>

          ---

          **\`.wcp\`** → for Winlator · **\`.zip\`** → for GameHub manual injection
          BODYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: false
          make_latest: true
          body_path: ${{ github.workspace }}/release_body.md
          files: |
            ./artifacts/*.wcp
            ./artifacts/*.zip
            ./artifacts/*.tzst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update nightly-latest persistent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          LATEST_TAG="nightly-latest"

          # Create release if it doesn't exist
          if ! gh release view "$LATEST_TAG" &>/dev/null; then
            gh release create "$LATEST_TAG" \
              --title "Nightly Latest (Always Current)" \
              --notes "Always points to the most recent all-in-one nightly build. Updated automatically on every new nightly." \
              --prerelease
            echo "Created $LATEST_TAG release"
          fi

          # Delete all existing assets so we can upload fresh ones
          RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${LATEST_TAG}" --jq '.id')
          gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].id' | while read asset_id; do
            gh api -X DELETE "repos/${REPO}/releases/assets/${asset_id}" || true
          done
          echo "Cleared old assets from $LATEST_TAG"

          # Upload all wcp, zip and tzst artifacts
          for f in ./artifacts/*.wcp ./artifacts/*.zip ./artifacts/*.tzst; do
            [ -f "$f" ] || continue
            gh release upload "$LATEST_TAG" "$f" --clobber
            echo "Uploaded $(basename $f) to $LATEST_TAG"
          done

          # Update release notes to point at the actual nightly tag
          BUILT_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${{ env.TAG_NAME }}"
          printf 'Always points to the most recent all-in-one nightly build.\n\n**Current build:** `%s`\n**Built:** %s\n\n[View full release notes](%s)\n' \
            "${{ env.TAG_NAME }}" "$BUILT_DATE" "$RELEASE_URL" > nightly_latest_notes.md
          gh release edit "$LATEST_TAG" --notes-file nightly_latest_notes.md

          echo "nightly-latest updated to ${{ env.TAG_NAME }}"

      - name: Update README with latest nightly
        env:
          FEX_VERSION: ${{ needs.build-fex.outputs.version }}
          FEX_COMMIT: ${{ needs.build-fex.outputs.commit }}
          VKD3D_COMMIT: ${{ needs.build-vkd3d.outputs.commit }}
          VKD3D_ARM64EC_COMMIT: ${{ needs.build-vkd3d-arm64ec.outputs.commit }}
          DXVK_COMMIT: ${{ needs.build-dxvk.outputs.commit }}
          DXVK_ARM64EC_COMMIT: ${{ needs.build-dxvk-arm64ec.outputs.commit }}
          DXVK_BINSEM_COMMIT: ${{ needs.build-dxvk-binsem.outputs.commit }}
          DXVK_BINSEM_ARM64EC_COMMIT: ${{ needs.build-dxvk-binsem-arm64ec.outputs.commit }}
          D7VK_COMMIT: ${{ needs.build-d7vk.outputs.commit }}
        run: |
          python3 <<'PY'
          import re, os
          from pathlib import Path

          tag        = os.environ["TAG_NAME"]
          repo       = os.environ.get("GITHUB_REPOSITORY", "The412Banner/Nightlies")
          release_url = f"https://github.com/{repo}/releases/tag/{tag}"

          fex_ver          = os.environ.get("FEX_VERSION", "unknown")
          fex_commit       = os.environ.get("FEX_COMMIT", "")
          vkd3d_commit     = os.environ.get("VKD3D_COMMIT", "")
          vkd3d_ec_commit  = os.environ.get("VKD3D_ARM64EC_COMMIT", "")
          dxvk_commit      = os.environ.get("DXVK_COMMIT", "")
          dxvk_ec_commit   = os.environ.get("DXVK_ARM64EC_COMMIT", "")
          dxvk_bs_commit   = os.environ.get("DXVK_BINSEM_COMMIT", "")
          dxvk_bs_ec_commit = os.environ.get("DXVK_BINSEM_ARM64EC_COMMIT", "")
          d7vk_commit      = os.environ.get("D7VK_COMMIT", "")
          turnip_tag       = os.environ.get("TURNIP_TAG", "unknown")
          turnip_name      = os.environ.get("TURNIP_NAME", "")

          new_block = "\n".join([
              "<!-- NIGHTLY-LATEST-START -->",
              "| | |",
              "| :--- | :--- |",
              f"| **Release** | [🔗 {tag}]({release_url}) |",
              f"| **FEXCore** | [`{fex_commit}`](https://github.com/FEX-Emu/FEX/commit/{fex_commit}) — {fex_ver} |",
              f"| **VKD3D-Proton (Std)** | [`{vkd3d_commit}`](https://github.com/HansKristian-Work/vkd3d-proton/commit/{vkd3d_commit}) |",
              f"| **VKD3D-Proton (ARM64EC)** | [`{vkd3d_ec_commit}`](https://github.com/HansKristian-Work/vkd3d-proton/commit/{vkd3d_ec_commit}) |",
              f"| **DXVK (GPLAsync)** | [`{dxvk_commit}`](https://github.com/doitsujin/dxvk/commit/{dxvk_commit}) |",
              f"| **DXVK (ARM64EC)** | [`{dxvk_ec_commit}`](https://github.com/doitsujin/dxvk/commit/{dxvk_ec_commit}) |",
              f"| **DXVK BinSem (GPLAsync)** | [`{dxvk_bs_commit}`](https://github.com/doitsujin/dxvk/commit/{dxvk_bs_commit}) — set `DXVK_DISABLE_TIMELINE_SEMAPHORES=1` to activate |",
              f"| **DXVK BinSem (ARM64EC)** | [`{dxvk_bs_ec_commit}`](https://github.com/doitsujin/dxvk/commit/{dxvk_bs_ec_commit}) — set `DXVK_DISABLE_TIMELINE_SEMAPHORES=1` to activate |",
              f"| **D7VK (DDraw/D3D7)** | [`{d7vk_commit}`](https://github.com/WinterSnowfall/d7vk/commit/{d7vk_commit}) — DDraw Wrapper slot; `.tzst` = bundled-asset refresh |",
              f"| **Box64** | [ptitSeb/box64](https://github.com/ptitSeb/box64/commits/main) + [Pipetto/box64](https://github.com/Pipetto-crypto/box64/commits/main) |",
              f"| **Turnip** | [{turnip_tag}](https://github.com/The412Banner/Banners-Turnip/releases/tag/{turnip_tag}) — {turnip_name} |",
              f"| **Files** | [`.wcp` and `.zip` — scroll to Assets]({release_url}) |",
              "<!-- NIGHTLY-LATEST-END -->",
          ])

          readme = Path("README.md").read_text()
          readme = re.sub(
              r"<!-- NIGHTLY-LATEST-START -->.*?<!-- NIGHTLY-LATEST-END -->",
              new_block,
              readme,
              flags=re.DOTALL,
          )
          Path("README.md").write_text(readme)
          print("README.md updated.")
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README for nightly ${TAG_NAME}"
          # nightlies-components-json writes to main as well, and a slow scheduled run can overlap
          # a dispatched one, so the ref can move between the rebase and the push ("cannot lock ref
          # 'refs/heads/main'"). Same retry loop that workflow already uses.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin HEAD && git push; then pushed=1; break; fi
            echo "README push raced with another workflow — retry ${attempt}"
            git rebase --abort >/dev/null 2>&1 || true
            sleep $(( (RANDOM % 5) + 3 ))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::README push still rejected after 5 attempts"
            exit 1
          fi

      # The catalog refresh must not depend on the chat notification below: a dropped
      # Discord webhook once failed this job AFTER the release was published, and this
      # step (then last, `if: success()`) was skipped. It also cannot rely on the
      # components workflow's own `workflow_run` trigger, which GitHub never fires for
      # runs dispatched with GITHUB_TOKEN (the Upstream Commit Watcher does exactly that).
      - name: Trigger nightlies_components.json update
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nightlies-components-json.yml --repo "$GITHUB_REPOSITORY"

      # ----------------------------------------------------------------
      # Discord notification — success
      # Requires DISCORD_WEBHOOK_URL to be set in repo secrets:
      #   Settings → Secrets and variables → Actions → New repository secret
      # ----------------------------------------------------------------
      # Chat is best-effort: a webhook hiccup (curl 56 = connection dropped mid-reply,
      # seen 2026-09-13) must never turn a published nightly red or fire the failure alert.
      - name: Notify Discord (success)
        if: success()
        continue-on-error: true
        run: |
          RELEASE_NAME="${{ env.RELEASE_NAME }}"
          TAG_NAME="${{ env.TAG_NAME }}"
          REPO="${{ github.repository }}"

          # Build "what's new" from upstream_changes.json (same logic as release body)
          DISCORD_TRIGGER="Scheduled build — no upstream changes detected."
          if [ -f "upstream_changes.json" ]; then
            CHANGED_COUNT=$(jq '.changed | length' upstream_changes.json)
            TRIGGERED_AT=$(jq -r '.triggered_at' upstream_changes.json)
            TRIGGERED_EPOCH=$(date -u -d "$TRIGGERED_AT" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            AGE=$(( NOW_EPOCH - TRIGGERED_EPOCH ))
            if [ "$CHANGED_COUNT" -gt "0" ] && [ "$AGE" -lt "10800" ]; then
              DISCORD_TRIGGER=""
              while IFS= read -r row; do
                R_NAME=$(echo "$row" | jq -r '.name')
                R_OLD=$(echo "$row" | jq -r '.old')
                R_NEW=$(echo "$row" | jq -r '.new')
                R_MSG=$(echo "$row" | jq -r '.msg' | cut -c1-60)
                [ -n "$DISCORD_TRIGGER" ] && DISCORD_TRIGGER+=$'\n'
                DISCORD_TRIGGER+="• **${R_NAME}** \`${R_OLD}\` → \`${R_NEW}\`: ${R_MSG}"
              done < <(jq -c '.changed[]' upstream_changes.json)
            fi
          fi

          DESC="${RELEASE_NAME}"$'\n\n'"[📦 Download from GitHub Releases](https://github.com/${REPO}/releases/tag/${TAG_NAME})"

          curl -sS -f --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg desc "$DESC" \
              --arg trigger "$DISCORD_TRIGGER" \
              --arg footer "GitHub Actions · ${REPO}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{embeds: [{
                title: "🚀 New Nightly Build Released",
                description: $desc,
                color: 5763719,
                fields: [{ name: "🔄 What'\''s New", value: $trigger, inline: false }],
                footer: { text: $footer },
                timestamp: $ts
              }]}')"

      - name: Notify Discord (failure)
        if: failure()
        continue-on-error: true
        run: |
          curl -sS -f --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Nightly Build Failed",
                "description": "One or more jobs failed during the nightly run.\n\n[🔍 View Actions Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "color": 15548997,
                "footer": { "text": "GitHub Actions · ${{ github.repository }}" },
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }'

