name: DXVK-Sarek 1.14.0 — stock + D3D10 fix builds

# ==================================================================
# Two .wcp files from pythonlover02/DXVK-Sarek v1.14.0:
#
#   dxvk-sarek-v1.14.0.wcp           upstream's release DLLs, as shipped
#   dxvk-sarek-v1.14.0-d3d10fix.wcp  the same DLLs, d3d10core.dll swapped
#                                    for one rebuilt with our ABI fix
#
# The bug (still in 1.14.0): src/d3d10/d3d10_core.cpp calls
# D3D11CoreCreateDevice with a 10-argument signature, but Sarek's
# d3d11.dll exports the 6-argument one, so every D3D10 app gets S_OK
# with a NULL device and crashes. The patch restores the 6-arg call and
# links d3d10core against Sarek's own d3d11 (d3d11_dep) again.
#
# d3d10core is built with upstream's release recipe (Steam Runtime
# sniper SDK container + .github/crossfiles/steamrt-*.txt), unpatched
# first (control) then patched incrementally, and CI asserts the call
# changed to the 6-arg form on x64 and x86 and nothing else rebuilt.
#
# 1.14.0 ships a 32-bit ddraw.dll (D7VK, D3D3-7); it goes in syswow64.
#
# ARTIFACTS ONLY — no release, no tag, no catalog change.
# ==================================================================

on:
  push:
    branches: [build/sarek-1.14]
    paths:
      - '.github/workflows/dxvk-sarek-1.14.yml'
      - 'patches/dxvk-sarek/1.14.0-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  SAREK_REPO: pythonlover02/DXVK-Sarek
  SAREK_TAG: v1.14.0
  SAREK_VER: 1.14.0
  SDK_IMAGE: registry.gitlab.steamos.cloud/proton/sniper/sdk:latest
  PATCH_FILE: patches/dxvk-sarek/1.14.0-d3d10core-abi-fix.patch

jobs:
  build:
    name: Build + verify + package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (patch file)
        uses: actions/checkout@v4
        with:
          path: nightlies

      - name: Checkout DXVK-Sarek ${{ env.SAREK_TAG }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SAREK_REPO }}
          ref: ${{ env.SAREK_TAG }}
          path: sarek
          submodules: recursive
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm zstd jq python3-pip
          pip3 install --user pefile

      - name: Upstream release DLLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release download "$SAREK_TAG" --repo "$SAREK_REPO" -p "dxvk-sarek-${SAREK_VER}.tar.gz" -D up
          tar -xzf "up/dxvk-sarek-${SAREK_VER}.tar.gz" -C up
          mkdir -p stock
          cp -a "up/dxvk-sarek-${SAREK_VER}/build/x64" "up/dxvk-sarek-${SAREK_VER}/build/x32" stock/
          ls -la stock/x64 stock/x32
          echo "## Source" >> $GITHUB_STEP_SUMMARY
          echo "- ${SAREK_REPO} \`${SAREK_TAG}\` = \`$(git -C sarek rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- upstream release tarball sha256 \`$(sha256sum up/dxvk-sarek-${SAREK_VER}.tar.gz | cut -d' ' -f1)\`" >> $GITHUB_STEP_SUMMARY

      - name: Build unpatched (control)
        working-directory: sarek
        run: |
          set -euxo pipefail
          grep -n "D3D11_SDK_VERSION" src/d3d10/d3d10_core.cpp
          docker pull "$SDK_IMAGE"
          docker run --rm -v "$PWD:/src:z" -w /src --user "$(id -u):$(id -g)" -e HOME=/tmp "$SDK_IMAGE" \
            bash -euxc 'printf ".SECONDARY:\n" > /tmp/keep.mk;
                        make -f Makefile -f /tmp/keep.mk OUT=build/container CROSSFILE_DIR=.github/crossfiles CROSSFILE_64=steamrt-x86_64.txt CROSSFILE_32=steamrt-i386.txt'
          mkdir -p ../ref
          cp -a build/container/x64 build/container/x32 ../ref/

      - name: Apply patch
        working-directory: sarek
        run: |
          set -euxo pipefail
          git apply --check "../nightlies/$PATCH_FILE"
          git apply "../nightlies/$PATCH_FILE"
          git diff --stat
          ! grep -q "D3D11_SDK_VERSION" src/d3d10/d3d10_core.cpp

      - name: Build patched (incremental)
        working-directory: sarek
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD:/src:z" -w /src --user "$(id -u):$(id -g)" -e HOME=/tmp "$SDK_IMAGE" \
            bash -euxc 'for a in 64 32; do ninja -C build/container/build.$a install; done;
                        find build/container/x64 build/container/x32 -type f ! -name "*.dll" -delete'
          mkdir -p ../out
          cp -a build/container/x64 build/container/x32 ../out/

      - name: Upload raw DLLs (patched + control + stock)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-sarek-v1.14.0-dlls
          path: |
            out/
            ref/
            stock/
          if-no-files-found: error

      - name: Verify
        run: |
          set -euo pipefail
          cat > exprange.py <<'EOF'
          import sys, pefile
          pe = pefile.PE(sys.argv[1], fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_EXPORT']])
          base = pe.OPTIONAL_HEADER.ImageBase
          rvas = sorted(e.address for e in pe.DIRECTORY_ENTRY_EXPORT.symbols)
          start = next(e.address for e in pe.DIRECTORY_ENTRY_EXPORT.symbols if e.name == b'D3D10CoreCreateDevice')
          stop = min([r for r in rvas if r > start] or [start + 0x200])
          print(hex(base + start), hex(base + stop))
          EOF
          fn() { local r; r=$(python3 exprange.py "$1"); set -- "$1" $r; llvm-objdump -d --no-show-raw-insn --print-imm-hex --start-address=$2 --stop-address=$3 "$1"; }
          cat > pecmp.py <<'EOF'
          import sys, pefile
          def norm(path):
              pe = pefile.PE(path)
              pe.FILE_HEADER.TimeDateStamp = 0
              pe.OPTIONAL_HEADER.CheckSum = 0
              return bytes(pe.write())
          sys.exit(0 if norm(sys.argv[1]) == norm(sys.argv[2]) else 1)
          EOF
          fail=0
          echo "## Verify" >> $GITHUB_STEP_SUMMARY

          # 1) the patch rebuilt d3d10core and nothing else
          for a in x64 x32; do
            for f in $(cd ref/$a && ls *.dll); do
              [ "$f" = d3d10core.dll ] && continue
              if python3 pecmp.py "ref/$a/$f" "out/$a/$f"; then
                echo "- $a/$f identical to the unpatched build" >> $GITHUB_STEP_SUMMARY
              else
                echo "::error::$a/$f differs from the unpatched build"; fail=1
              fi
            done
            if cmp -s "ref/$a/d3d10core.dll" "out/$a/d3d10core.dll"; then
              echo "::error::$a/d3d10core.dll did not change"; fail=1
            fi
          done

          # 2) the DLL set we package matches upstream's release
          for a in x64 x32; do
            diff <(cd stock/$a && ls *.dll) <(cd out/$a && ls *.dll) || { echo "::error::$a DLL set differs from upstream release"; fail=1; }
          done

          # 3) the call itself: x64 arg slots, x86 stdcall pop size; stock must show the bug
          for d in stock ref; do
            fn $d/x64/d3d10core.dll > $d.64.s; fn $d/x32/d3d10core.dll > $d.32.s
            grep -q -E 'movl[[:space:]]+\$0x7, 0x38\(%rsp\)' $d.64.s || { echo "::error::$d x64 does not show the 10-arg call"; fail=1; }
            grep -q -E 'subl[[:space:]]+\$0x28, %esp' $d.32.s || { echo "::error::$d x86 lacks the 40-byte stdcall pop"; fail=1; }
          done
          fn out/x64/d3d10core.dll > out64.s; fn out/x32/d3d10core.dll > out32.s
          if grep -q -E '\$0x7, 0x38\(%rsp\)' out64.s; then echo "::error::patched x64 still passes SDKVersion as arg 8"; fail=1; fi
          grep -q -E 'movl[[:space:]]+\$0x1, 0x20\(%rsp\)' out64.s || { echo "::error::patched x64: FeatureLevels=1 not in arg 5"; fail=1; }
          if grep -q -E 'movl[[:space:]]+\$0x7, 0x1c\(%esp\)' out32.s; then echo "::error::patched x86 still passes SDKVersion"; fail=1; fi
          if grep -q -E 'subl[[:space:]]+\$0x28, %esp' out32.s; then echo "::error::patched x86 still expects a 40-byte pop"; fail=1; fi
          grep -q -E 'subl[[:space:]]+\$0x18, %esp' out32.s || { echo "::error::patched x86: no 24-byte (6-arg) stdcall pop"; fail=1; }

          # 4) info: control build vs upstream release bytes
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### control build vs upstream release (info)" >> $GITHUB_STEP_SUMMARY
          for a in x64 x32; do for f in $(cd stock/$a && ls *.dll); do
            if python3 pecmp.py "stock/$a/$f" "ref/$a/$f"; then r=identical; else r=differs; fi
            echo "- $a/$f: $r" >> $GITHUB_STEP_SUMMARY
          done; done

          [ $fail -eq 0 ] || exit 1
          echo "ALL CHECKS PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Package .wcp (stock + d3d10fix)
        run: |
          set -euxo pipefail
          mkdir -p dist
          pack() {  # $1 = name, $2 = d3d10core source dir
            rm -rf pkg && mkdir -p pkg/system32 pkg/syswow64
            install -m755 stock/x64/*.dll pkg/system32/
            install -m755 stock/x32/*.dll pkg/syswow64/
            install -m755 "$2/x64/d3d10core.dll" pkg/system32/d3d10core.dll
            install -m755 "$2/x32/d3d10core.dll" pkg/syswow64/d3d10core.dll
            NAME="$1" python3 - <<'EOF'
          import json, os
          name = os.environ['NAME']
          fix = name.endswith('-d3d10fix')
          files = []
          for d, ph in (('system32', '${system32}'), ('syswow64', '${syswow64}')):
              for f in sorted(os.listdir('pkg/' + d)):
                  files.append({'source': f'{d}/{f}', 'target': f'{ph}/{f}'})
          desc = ("DXVK-Sarek 1.14.0 (DXVK 1.10.x, Vulkan 1.1/1.2) for old/low-power GPUs and ARM via Box64/FEX; "
                  "D3D3-7 (32-bit ddraw), D3D8, D3D9, D3D10, D3D11. Optional tuning env vars: DXVK_FRAME_RATE_PACING=sliced, "
                  "DXVK_SHADER_COMPILATION_METHOD=dyasync|async|none. Upstream: pythonlover02")
          if fix:
              desc += (" | D3D10 fix: d3d10core rebuilt so D3D10CoreCreateDevice calls d3d11 with the matching"
                       " 6-argument D3D11CoreCreateDevice (stock 1.14.0 crashes every D3D10 app with a NULL device).")
          p = {'type': 'DXVK', 'versionName': name, 'versionCode': 1 if fix else 0, 'description': desc, 'files': files}
          json.dump(p, open('pkg/profile.json', 'w'), indent=2)
          EOF
            cat pkg/profile.json
            tar -C pkg --format=ustar -cf - profile.json system32 syswow64 | zstd -19 -T0 -o "dist/$1.wcp"
            tar --zstd -tvf "dist/$1.wcp"
          }
          pack "dxvk-sarek-v${SAREK_VER}" stock
          pack "dxvk-sarek-v${SAREK_VER}-d3d10fix" out
          (cd dist && sha256sum *.wcp | tee SHA256SUMS)
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; cat dist/SHA256SUMS >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload .wcp files
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-sarek-v1.14.0-wcp
          path: dist/*
          if-no-files-found: error
