name: FEXCore gn6 (GameNative patch series)

# Upstream FEX-2611 + the GameNative patch series gn-6 (GameNative/FEX branch "gamenative",
# 12 patches: protected launchers / anti-tamper, Counter-Strike 2 load ordering, code cache fixes).
# Artifacts only: nothing is published.
#   android: the all-in-one workflow's build-fex job -> FEXCore-2611-gn6.wcp + FEXCore-2611-gn6-unix.wcp (bionic unixlibs)
#   linux:   the fexcore-linux-stable.yml build job  -> FEXCore-2611-gn6-linux.wcp (glibc unixlibs, Proton tree)
# The series does not touch Source/Windows/UnixLib, so the .so files are the upstream FEX-2611 ones.

on:
  workflow_dispatch:
  push:
    branches: [ 'feat/fex-gn6' ]
    paths: [ '.github/workflows/fexcore-gn6.yml' ]

permissions:
  contents: read

env:
  FEX_VER: '2611'
  FEX_COMMIT: 8f92e80dccd043e5f9e2cec1be69f5168562eab9
  GN_COMMIT: c875b4ad247a486a269342d339596f13f27df8d3

jobs:
  android:
    name: FEXCore gn6 (Bannerlator .wcp + -unix)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils jq git zip file binutils \
            build-essential python3 pkg-config cmake zstd \
            dos2unix perl tar unzip meson ninja-build wget

      - name: Setup GLSLANG
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup Toolchain
        run: |
          LLVM_MINGW_TAG="20251104"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH

      - name: Build FEX
        id: version
        run: |
          git clone --recursive --branch "FEX-$FEX_VER" https://github.com/FEX-Emu/FEX.git source
          # GameNative patch series (GameNative/FEX, branch "gamenative", tag gn-6), pinned by SHA.
          git clone --quiet https://github.com/GameNative/FEX.git gn
          git -C gn checkout --quiet "$GN_COMMIT"
          [ "$(git -C gn rev-parse HEAD)" = "$GN_COMMIT" ] || { echo "::error::GameNative series is not at $GN_COMMIT"; exit 1; }
          [ "$(cat gn/gamenative/SERIES_VERSION)" = "6" ] || { echo "::error::series version is not 6"; exit 1; }
          [ "$(git -C source rev-parse HEAD)" = "$FEX_COMMIT" ] || { echo "::error::FEX-$FEX_VER is not $FEX_COMMIT"; exit 1; }
          # Fixed committer + date: both jobs get the same patched commit, so FEX names itself the same.
          export GIT_COMMITTER_NAME=nightlies-ci GIT_COMMITTER_EMAIL=ci@invalid GIT_COMMITTER_DATE="2026-11-06T14:37:25Z"
          ( cd source && sh ../gn/gamenative/apply.sh ../gn/gamenative )
          git -C source log --oneline "$FEX_COMMIT..HEAD"
          [ "$(git -C source rev-list --count "$FEX_COMMIT..HEAD")" = "12" ] || { echo "::error::expected 12 patches applied"; exit 1; }
          echo "PATCHED=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "patched HEAD: $(git -C source rev-parse HEAD) ($(git -C source describe --abbrev=7))"
          cd source

          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="FEXCore-${FEX_VER}-gn6"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_HASH}" >> $GITHUB_OUTPUT

          build_arch() {
            local triple="$1"
            local dest="$2"
            local build_dir="build-${triple}"

            rm -rf "$build_dir" && mkdir "$build_dir" && cd "$build_dir"
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              ..
            ninja -j 2
            DESTDIR="$dest" ninja install
            cd ..
          }

          build_arch "arm64ec" "../../stage-ec"
          build_arch "aarch64" "../../stage-wo"

      - name: Package
        run: |
          rm -rf final_package && mkdir -p final_package/system32
          DLL_EC=$(find stage-ec -type f -name '*.dll' | head -n 1)
          DLL_WOW=$(find stage-wo -type f -name '*.dll' | head -n 1)

          cp "$DLL_EC" final_package/system32/libarm64ecfex.dll
          cp "$DLL_WOW" final_package/system32/libwow64fex.dll
          /opt/llvm-mingw/bin/llvm-strip --strip-all final_package/system32/*.dll

          chmod 0755 final_package/system32/*.dll
          DESC="FEXCore ${FEX_VER} + GameNative gn-6 patches (FEX-${FEX_VER} tag ${FEX_COMMIT:0:8}, series ${GN_COMMIT:0:8})"
          jq -n --arg v "$VERSION_NAME" --arg d "$DESC" \
            '{type: "FEXCore", versionName: $v, versionCode: 6, description: $d, author: "FEX-Emu + GameNative",
              files: [ {source: "system32/libarm64ecfex.dll", target: "${system32}/libarm64ecfex.dll"},
                       {source: "system32/libwow64fex.dll",   target: "${system32}/libwow64fex.dll"} ]}' \
            > final_package/profile.json
          cat final_package/profile.json

          # Same container as the published stable packages: tar with ./ root, owner 0:0, zstd -19.
          ( cd final_package && tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -19 -q -o "../${VERSION_NAME}.wcp" )
          zstd -dc "${VERSION_NAME}.wcp" | tar -tvf -

      - uses: actions/upload-artifact@v4
        with:
          name: fexcore-gn6
          path: 'FEXCore-*-gn6.wcp'

      # --- Unix (.so) variant: same FEX checkout as the DLLs above, so the
      #     DLLs + native aarch64 .so stay a matched pair for this exact commit.
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk
          key: android-ndk-r27c

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_VER="r27c"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -O ndk.zip
          rm -rf /tmp/ndk-x && mkdir -p /tmp/ndk-x
          unzip -q ndk.zip -d /tmp/ndk-x
          sudo rm -rf /opt/android-ndk
          sudo mv "/tmp/ndk-x/android-ndk-${NDK_VER}" /opt/android-ndk
          rm -rf ndk.zip /tmp/ndk-x

      - name: Build unix libs (aarch64 bionic .so)
        run: |
          set -euo pipefail
          # Native aarch64 FEX UnixLib .so, built for BIONIC (Android NDK r27c,
          # API 28) so it loads in WinNative/Bannerlator bionic wine — NOT glibc.
          # Built from THIS job's own FEX checkout (source/) so the DLLs + .so
          # remain a matched pair for this exact commit.
          # HARD-FAIL on an older FEX ref that lacks UnixLib — never emit a
          # DLL-only "-unix" wcp.
          if [ ! -f source/Source/Windows/UnixLib/FEXUnixLib.cpp ]; then
            echo "::error::No source/Source/Windows/UnixLib/FEXUnixLib.cpp in this FEX checkout (older ref) — cannot build unix .so"
            exit 1
          fi

          NDK="/opt/android-ndk"
          API=28
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang++"
          "$CXX" --version | head -1

          # bionic libc does NOT provide shm_open/shm_unlink, and nothing else
          # does either. Wine's loader dlopen()s this .so with RTLD_NOW, which
          # requires EVERY symbol resolved — an undefined shm_open makes dlopen
          # return NULL and the unixlib silently never loads. So DEFINE ENOSYS
          # stubs and compile them straight INTO the .so (FEX's SHM stats are
          # non-essential to translation; a failing stub is fine — FEX skips them).
          #
          # Header = DECLARATIONS only, force-included so FEXUnixLib.cpp (which
          # calls shm_open/shm_unlink via <sys/mman.h>, where bionic omits their
          # prototypes) still compiles.
          cat > /tmp/bionic_shm_decl.h <<'HDR'
          #pragma once
          #include <sys/types.h>
          extern "C" {
          int shm_open(const char* name, int oflag, mode_t mode);
          int shm_unlink(const char* name);
          }
          HDR

          # Stub = DEFINITIONS, compiled to an object and linked into each .so so
          # there are NO unresolved shm_open/shm_unlink symbols left for RTLD_NOW.
          cat > /tmp/fex_bionic_shm_stub.c <<'STUB'
          #include <errno.h>
          int shm_open(const char* n, int o, unsigned m){ (void)n; (void)o; (void)m; errno = ENOSYS; return -1; }
          int shm_unlink(const char* n){ (void)n; errno = ENOSYS; return -1; }
          STUB
          NDK_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          "$NDK_CC" -c -fPIC -O2 -o /tmp/fex_bionic_shm_stub.o /tmp/fex_bionic_shm_stub.c

          mkdir -p unixlibs
          # No -lrt (bionic folds it into libc); no --allow-shlib-undefined — with
          # the stub linked in, shm_open/shm_unlink are defined and the only
          # remaining UND symbols are libc (@LIBC) + libc++ (NEEDED
          # libc++_shared.so), which resolve at load from imagefs/usr/lib on
          # LD_LIBRARY_PATH.
          CXXFLAGS="-shared -fPIC -O2 -std=c++17 -g3 -gdwarf-4 -fno-omit-frame-pointer \
            -fasynchronous-unwind-tables -funwind-tables -mtune=generic \
            -include /tmp/bionic_shm_decl.h"
          # Same TU built twice, named for FEX's two UnixLib targets (byte-identical),
          # each with the shm stub object linked in.
          for name in libwow64fex libarm64ecfex; do
            "$CXX" $CXXFLAGS -o "unixlibs/${name}.so" \
              source/Source/Windows/UnixLib/FEXUnixLib.cpp /tmp/fex_bionic_shm_stub.o
          done

          # Wine libs are executable (0771); a 0600 .so cannot be dlopen'd on
          # Android. Make them executable so the packaged wcp carries the exec bit.
          chmod 0755 unixlibs/*.so

          echo "Built bionic unix .so (shm stubs compiled in):"
          file unixlibs/*.so
          # Self-check: hard-fail if shm_open/shm_unlink are still undefined.
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for name in libwow64fex libarm64ecfex; do
            BAD=$("$RE" --dyn-syms "unixlibs/${name}.so" | grep ' UND ' | grep -E 'shm_open|shm_unlink' || true)
            if [ -n "$BAD" ]; then
              echo "::error::${name}.so still has undefined shm symbols:"; echo "$BAD"; exit 1
            fi
          done
          echo "OK: no undefined shm_open/shm_unlink in the unix .so"

      - name: Package (unix wcp)
        run: |
          set -euo pipefail
          rm -rf final_package_unix
          mkdir -p final_package_unix/system32 final_package_unix/aarch64-unix

          # DLLs: reuse THIS job's already-built, matched DLLs (from final_package).
          cp final_package/system32/libarm64ecfex.dll final_package_unix/system32/libarm64ecfex.dll
          cp final_package/system32/libwow64fex.dll   final_package_unix/system32/libwow64fex.dll
          # .so: this job's matched bionic unix libs. Force the execute bit so
          # the wcp tar stores them 0755 (a 0600 .so cannot be dlopen'd on
          # Android; wine libs are 0771).
          cp unixlibs/libarm64ecfex.so final_package_unix/aarch64-unix/libarm64ecfex.so
          cp unixlibs/libwow64fex.so   final_package_unix/aarch64-unix/libwow64fex.so
          chmod 0755 final_package_unix/aarch64-unix/*.so

          # TODO(delivery-path): confirm the .so target dir from the proton
          # loader-search spike. On Bannerlator ${libdir}=imagefs/usr/lib, where
          # the FEX loader does NOT search — swap SO_TARGET_DIR when the spike
          # lands. Single-quoted so ${libdir} stays literal in the JSON below.
          SO_TARGET_DIR='${libdir}/wine/aarch64-unix'

          DESC="FEXCore ${FEX_VER} + GameNative gn-6 patches (FEX-${FEX_VER} tag ${FEX_COMMIT:0:8}, series ${GN_COMMIT:0:8}) +unix libs"
          jq -n --arg v "${VERSION_NAME}-unix" --arg d "$DESC" --arg so "$SO_TARGET_DIR" \
            '{type: "FEXCore", versionName: $v, versionCode: 0, description: $d,
              files: [ {source: "aarch64-unix/libarm64ecfex.so", target: ($so + "/libarm64ecfex.so")},
                       {source: "aarch64-unix/libwow64fex.so",   target: ($so + "/libwow64fex.so")},
                       {source: "system32/libarm64ecfex.dll",    target: "${system32}/libarm64ecfex.dll"},
                       {source: "system32/libwow64fex.dll",      target: "${system32}/libwow64fex.dll"} ]}' \
            > final_package_unix/profile.json
          cat final_package_unix/profile.json

          ( cd final_package_unix && tar --owner=0 --group=0 --numeric-owner -cf - . | zstd -19 -q -o "../${VERSION_NAME}-unix.wcp" )
          zstd -dc "${VERSION_NAME}-unix.wcp" | tar -tvf -

      - name: Verify
        run: |
          set -euo pipefail
          file final_package/system32/*.dll final_package_unix/aarch64-unix/*.so
          file final_package/system32/libwow64fex.dll | grep -qiE 'PE32\+ executable.*(Aarch64|ARM64)' \
            || { echo "::error::libwow64fex.dll is not an ARM64 PE DLL"; exit 1; }
          loadcfg=$(/opt/llvm-mingw/bin/llvm-readobj --coff-load-config final_package/system32/libarm64ecfex.dll)
          grep -q 'CHPEMetadata' <<<"$loadcfg" || { echo "::error::libarm64ecfex.dll has no ARM64EC (CHPE) metadata"; exit 1; }
          # gn patch 0003 adds this export
          exports=$(/opt/llvm-mingw/bin/llvm-readobj --coff-exports final_package/system32/libarm64ecfex.dll)
          grep -q 'BTCpu64NotifyNonImageViews' <<<"$exports" || { echo "::error::gn export BTCpu64NotifyNonImageViews missing"; exit 1; }
          strings -a final_package/system32/libarm64ecfex.dll | grep -m3 -E 'FEX-[0-9]{4}' || true
          sha256sum FEXCore-*-gn6*.wcp

      - uses: actions/upload-artifact@v4
        with:
          name: fexcore-gn6-unix
          path: 'FEXCore-*-gn6-unix.wcp'

  linux:
    name: FEXCore gn6 (Linux glibc Proton)
    # 22.04 = glibc 2.35 for the cross toolchain, so the .so files need nothing newer than the
    # glibc every current Linux rootfs has (Valve's own FEX unixlib asks for 2.34).
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils zstd jq git zip file \
            build-essential python3 pkg-config cmake ninja-build wget \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup llvm-mingw
        run: |
          LLVM_MINGW_TAG="20251104"
          # FEX-2505 links clang_rt.builtins-arm64ec by its old name; build it with the llvm-mingw of its day.
          if [ "$(printf '%s\n' "${{ env.FEX_VER }}" 2507 | sort -V | head -1)" != 2507 ]; then
            LLVM_MINGW_TAG="20250430"
          fi
          echo "llvm-mingw $LLVM_MINGW_TAG"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone FEX and apply the GameNative gn-6 series
        run: |
          set -euo pipefail
          # Full clone (not shallow): the patched commits sit past the tag and FEX names itself with git describe.
          git clone --branch "FEX-$FEX_VER" --recurse-submodules --shallow-submodules https://github.com/FEX-Emu/FEX.git source
          # GameNative patch series (GameNative/FEX, branch "gamenative", tag gn-6), pinned by SHA.
          git clone --quiet https://github.com/GameNative/FEX.git gn
          git -C gn checkout --quiet "$GN_COMMIT"
          [ "$(git -C gn rev-parse HEAD)" = "$GN_COMMIT" ] || { echo "::error::GameNative series is not at $GN_COMMIT"; exit 1; }
          [ "$(cat gn/gamenative/SERIES_VERSION)" = "6" ] || { echo "::error::series version is not 6"; exit 1; }
          [ "$(git -C source rev-parse HEAD)" = "$FEX_COMMIT" ] || { echo "::error::FEX-$FEX_VER is not $FEX_COMMIT"; exit 1; }
          # Fixed committer + date: both jobs get the same patched commit, so FEX names itself the same.
          export GIT_COMMITTER_NAME=nightlies-ci GIT_COMMITTER_EMAIL=ci@invalid GIT_COMMITTER_DATE="2026-11-06T14:37:25Z"
          ( cd source && sh ../gn/gamenative/apply.sh ../gn/gamenative )
          git -C source log --oneline "$FEX_COMMIT..HEAD"
          [ "$(git -C source rev-list --count "$FEX_COMMIT..HEAD")" = "12" ] || { echo "::error::expected 12 patches applied"; exit 1; }
          echo "PATCHED=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "patched HEAD: $(git -C source rev-parse HEAD) ($(git -C source describe --abbrev=7))"
          echo "COMMIT=$FEX_COMMIT" >> "$GITHUB_ENV"

      - name: Build the DLLs (arm64ec + wow64)
        run: |
          set -euo pipefail
          cd source
          # The toolchain file moved into Data/CMake after FEX-2505.
          TOOLCHAIN="$PWD/Data/CMake/toolchain_mingw.cmake"
          [ -f "$TOOLCHAIN" ] || TOOLCHAIN="$PWD/toolchain_mingw.cmake"
          [ -f "$TOOLCHAIN" ] || { echo "::error::no toolchain_mingw.cmake in FEX-${{ env.FEX_VER }}"; exit 1; }
          # FEX-2507 and older bundle an fmt whose format.h uses malloc/free without <cstdlib>,
          # which today's llvm-mingw no longer pulls in indirectly.
          EXTRA_CXX=""
          if [ "$(printf '%s\n' "${{ env.FEX_VER }}" 2508 | sort -V | head -1)" != 2508 ]; then
            EXTRA_CXX="-include cstdlib"
          fi
          build_arch() {
            local triple="$1" dest="$2" dir="build-$1"
            rm -rf "$dir" && mkdir "$dir" && cd "$dir"
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              -DBUILD_TESTS=False \
              ${EXTRA_CXX:+-DCMAKE_CXX_FLAGS="$EXTRA_CXX"} \
              ${FEX_OVERRIDE:+"$FEX_OVERRIDE"} \
              ..
            ninja -j 4
            DESTDIR="$dest" ninja install
            cd ..
          }
          build_arch arm64ec "$GITHUB_WORKSPACE/stage-ec"
          build_arch aarch64 "$GITHUB_WORKSPACE/stage-wow"

      - name: Build the unixlibs (aarch64 glibc)
        run: |
          set -euo pipefail
          if [ ! -f source/Source/Windows/UnixLib/FEXUnixLib.cpp ]; then
            echo "FEX-${{ env.FEX_VER }} predates the unixlib (added in 2607): DLL-only package."
            echo "HAS_UNIXLIB=0" >> "$GITHUB_ENV"
            exit 0
          fi
          # FEX's own CMake project for the two targets (same source, links librt), configured
          # standalone for aarch64 Linux.
          cmake -S source/Source/Windows/UnixLib -B build-unix -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/wine/aarch64-unix
          ninja -C build-unix
          DESTDIR="$GITHUB_WORKSPACE/stage-unix" ninja -C build-unix install
          echo "HAS_UNIXLIB=1" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          V="${{ env.FEX_VER }}"
          NAME="FEXCore-${V}-gn6-linux"
          PKG="$GITHUB_WORKSPACE/pkg/$NAME"
          WIN="$PKG/files/lib/wine/aarch64-windows"
          UNIX="$PKG/files/lib/wine/aarch64-unix"
          mkdir -p "$WIN"

          cp "$(find stage-ec -type f -name '*.dll' | head -n1)" "$WIN/libarm64ecfex.dll"
          cp "$(find stage-wow -type f -name '*.dll' | head -n1)" "$WIN/libwow64fex.dll"
          llvm-strip --strip-all "$WIN"/*.dll

          if [ "$HAS_UNIXLIB" = "1" ]; then
            mkdir -p "$UNIX"
            for n in libarm64ecfex libwow64fex; do
              cp "$(find stage-unix -type f -name "$n.so" | head -n1)" "$UNIX/$n.so"
            done
            aarch64-linux-gnu-strip --strip-unneeded "$UNIX"/*.so
            chmod 0755 "$UNIX"/*.so
          fi

          {
            echo "FEX-${V} + GameNative gn-6 patch series for Linux (glibc) Proton, ARM64"
            echo "source: https://github.com/FEX-Emu/FEX/tree/FEX-${V} (${COMMIT})"
            echo "patches: https://github.com/GameNative/FEX/tree/gn-6/gamenative (${GN_COMMIT}), 12 patches; patched HEAD ${PATCHED}"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${GITHUB_REPOSITORY} run ${GITHUB_RUN_ID}"
            if [ "$HAS_UNIXLIB" = "1" ]; then
              echo "files:  2 DLLs (aarch64-windows) + 2 glibc unixlibs (aarch64-unix), one matched build"
            else
              echo "files:  2 DLLs (aarch64-windows); this FEX predates the unixlib"
            fi
            echo
            echo "Install: unpack into the Proton's folder (the one holding 'proton' and 'files/'),"
            echo "after backing up its files/lib/wine/aarch64-windows/lib*fex.dll and aarch64-unix/lib*fex.so."
          } > "$PKG/FEX-VERSION.txt"
          ( cd "$PKG" && find files -type f | sort | xargs sha256sum ) > "$PKG/SHA256SUMS.txt"

          files_json=$( cd "$PKG" && find files -type f | sort | jq -R '{source: ., target: ("${proton}/" + .)}' | jq -cs . )
          if [ "$HAS_UNIXLIB" = "1" ]; then desc="FEX-${V} (${COMMIT:0:9}) + GameNative gn-6 patches (${GN_COMMIT:0:8}) for Linux glibc Proton, ARM64: 2 DLLs + 2 glibc unixlibs, one matched build"
          else desc="FEX-${V} (${COMMIT:0:9}) for Linux glibc Proton, ARM64: 2 DLLs (FEX before 2607 has no unixlib)"; fi
          jq -n --arg v "${V}-gn6-linux" --arg d "$desc" --argjson files "$files_json" \
            '{type: "FEXCore-Linux", versionName: $v, versionCode: 0, description: $d, author: "FEX-Emu + GameNative", files: $files}' \
            > "$PKG/profile.json"

          mkdir -p out
          ( cd "$PKG" && tar -cf - . | zstd -19 -q -o "$GITHUB_WORKSPACE/out/$NAME.wcp" )
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Verify
        run: |
          set -euo pipefail
          WIN="$PKG/files/lib/wine/aarch64-windows"
          UNIX="$PKG/files/lib/wine/aarch64-unix"
          # libwow64fex.dll is plain ARM64. libarm64ecfex.dll is ARM64EC, whose header carries the
          # x86-64 machine type by design; what makes it ARM64EC is the CHPE metadata in its load config.
          file "$WIN/libwow64fex.dll"
          file "$WIN/libwow64fex.dll" | grep -q 'PE32+ executable.*Aarch64' \
            || { echo "::error::libwow64fex.dll is not an ARM64 PE DLL"; exit 1; }
          file "$WIN/libarm64ecfex.dll"
          # Output is captured first: under pipefail, grep -q closing the pipe early fails the reader.
          loadcfg=$(llvm-readobj --coff-load-config "$WIN/libarm64ecfex.dll")
          grep -q 'CHPEMetadata' <<<"$loadcfg" \
            || { echo "::error::libarm64ecfex.dll has no ARM64EC (CHPE) metadata"; exit 1; }
          if [ "$HAS_UNIXLIB" = "1" ]; then
            for f in "$UNIX"/*.so; do
              file "$f"
              file "$f" | grep -q 'ELF 64-bit LSB shared object, ARM aarch64' \
                || { echo "::error::$f is not an aarch64 ELF shared object"; exit 1; }
              needed=$(aarch64-linux-gnu-readelf -d "$f" | grep NEEDED || true)
              echo "$needed"
              # glibc, never bionic: libc.so.6 must be there, a bare libc.so must not.
              echo "$needed" | grep -q '\[libc\.so\.6\]' || { echo "::error::$f does not link glibc"; exit 1; }
              if echo "$needed" | grep -q '\[libc\.so\]'; then echo "::error::$f links bionic libc"; exit 1; fi
              max=$(aarch64-linux-gnu-readelf -V "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "highest glibc symbol version: $max"
              syms=$(aarch64-linux-gnu-readelf --dyn-syms -W "$f")
              grep -q '__wine_unix_call_funcs' <<<"$syms" \
                || { echo "::error::$f does not export __wine_unix_call_funcs"; exit 1; }
            done
          fi
          zstd -dc out/*.wcp | tar -t
          zstd -dc out/*.wcp | tar -xO ./profile.json

      - uses: actions/upload-artifact@v4
        with:
          name: fexcore-gn6-linux
          path: out/*.wcp
