name: Nightlies Components JSON

on:
  workflow_run:
    workflows: ["All-in-One Emulation Nightlies"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate nightlies_components.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"

          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]

          # Static releases with their component type
          STATIC_RELEASES = [
              ("Box64",                    "Box64"),
              ("Box64-Bionic",             "Box64"),
              ("Box64-Hybrid",             "Box64"),
              ("Wowbox64",                 "WOWBox64"),
              ("DXVK-SAREK",               "DXVK"),
              ("DXVK-SAREK-ASYNC",         "DXVK"),
              ("DXVK-SAREK-ASYNC-ARM64EC", "DXVK"),
              ("Dxvk",                     "DXVK"),
              ("Dxvk-arm64ec",             "DXVK"),
              ("Dxvk-gplasync",            "DXVK"),
              ("Dxvk-gplasync-arm64ec",    "DXVK"),
              ("Dxvk-binsem-gplasync",         "DXVK"),
              ("Dxvk-binsem-gplasync-arm64ec", "DXVK"),
              ("FexCore",                  "FEXCore"),
              ("VKD3D-PROTON-ARM",         "VKD3D"),
              ("Vkd3d-proton",             "VKD3D"),
          ]

          def detect_nightly_type(name):
              n = name.lower()
              # Box64EC (box64ec.dll, experimental) before the plain "box64" match below.
              if "box64ec" in n:
                  return "Box64EC"
              if "wow64" in n or "wowbox" in n:
                  return "WOWBox64"
              if "box64" in n:
                  return "Box64"
              if "d7vk" in n:
                  return "D7VK"
              if "dxvk" in n:
                  return "DXVK"
              if "vkd3d" in n:
                  return "VKD3D"
              if "fex" in n:
                  return "FEXCore"
              return None  # skip (glslang, etc.)

          def fetch_assets(tag, repo=None):
              cmd = ["gh", "release", "view", tag, "--json", "assets",
                     "-q", ".assets[] | {name: .name, url: .url}"]
              if repo:
                  cmd += ["--repo", repo]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  print(f"  WARNING: could not fetch {tag}: {result.stderr.strip()}")
                  return []
              lines = result.stdout.strip().splitlines()
              assets = []
              for line in lines:
                  if line.strip():
                      assets.append(json.loads(line))
              return assets

          entries = []

          # Static releases
          for tag, comp_type in STATIC_RELEASES:
              print(f"Fetching {tag}...")
              assets = fetch_assets(tag)
              for asset in assets:
                  name = asset["name"]
                  if not (name.endswith(".wcp") or name.endswith(".zip")):
                      continue
                  ver_name = name.rsplit(".", 1)[0]
                  entries.append({
                      "type":      comp_type,
                      "verName":   ver_name,
                      "verCode":   "0",
                      "remoteUrl": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  })
              print(f"  {len(assets)} assets")

          # nightly-latest
          print("Fetching nightly-latest...")
          nightly_assets = fetch_assets("nightly-latest")
          for asset in nightly_assets:
              name = asset["name"]
              if not (name.endswith(".wcp") or name.endswith(".zip")):
                  continue
              comp_type = detect_nightly_type(name)
              if not comp_type:
                  continue
              ver_name = name.rsplit(".", 1)[0]
              entries.append({
                  "type":      comp_type,
                  "verName":   ver_name,
                  "verCode":   "0",
                  "remoteUrl": f"https://github.com/{repo}/releases/download/nightly-latest/{name}",
              })
          print(f"  {len(nightly_assets)} assets")

          # Mixed Wine/Proton releases — type derived from filename prefix.
          # Proton/wine carries both wine-* and proton-* assets in one release;
          # Proton-11 is proton-only. .wcp/.zip filter automatically skips
          # the .wcp.xz / .sha256 sidecar files.
          MIXED_WINE_PROTON = [
              ("Proton/wine", "auto"),    # wine-* -> Wine, proton-* -> Proton
              ("Proton-11",   "Proton"),  # all entries are Proton
          ]

          def classify_wine_proton(name, mode):
              if mode == "Proton":
                  return "Proton"
              n = name.lower()
              if n.startswith("wine-") or n.startswith("wine_"):
                  return "Wine"
              if n.startswith("proton-") or n.startswith("proton_"):
                  return "Proton"
              return None

          for tag, mode in MIXED_WINE_PROTON:
              print(f"Fetching {tag}...")
              assets = fetch_assets(tag)
              wp_added = 0
              for asset in assets:
                  name = asset["name"]
                  if not (name.endswith(".wcp") or name.endswith(".zip")):
                      continue
                  comp_type = classify_wine_proton(name, mode)
                  if not comp_type:
                      continue
                  ver_name = name.rsplit(".", 1)[0]
                  entries.append({
                      "type":      comp_type,
                      "verName":   ver_name,
                      "verCode":   "0",
                      "remoteUrl": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  })
                  wp_added += 1
              print(f"  {len(assets)} assets ({wp_added} Wine/Proton indexed)")

          # Banners-Turnip — all releases GPU driver
          print("Fetching Banners-Turnip all releases...")
          turnip_driver_entries = []
          list_result = subprocess.run(
              ["gh", "release", "list", "--repo", "The412Banner/Banners-Turnip",
               "--json", "tagName", "--limit", "100",
               "-q", ".[].tagName"],
              capture_output=True, text=True
          )
          if list_result.returncode == 0 and list_result.stdout.strip():
              tags = list_result.stdout.strip().splitlines()
              for tag in tags:
                  tag = tag.strip()
                  result = subprocess.run(
                      ["gh", "release", "view", tag, "--repo", "The412Banner/Banners-Turnip",
                       "--json", "tagName,assets",
                       "-q", "{tag: .tagName, assets: [.assets[] | {name: .name, url: .url}]}"],
                      capture_output=True, text=True
                  )
                  if result.returncode != 0 or not result.stdout.strip():
                      print(f"  WARNING: could not fetch {tag}: {result.stderr.strip()}")
                      continue
                  data = json.loads(result.stdout.strip())
                  for asset in data["assets"]:
                      name = asset["name"]
                      if not name.endswith(".zip"):
                          continue
                      if "turnip" not in name.lower():
                          continue
                      # Banners-Turnip also publishes Wayland builds (Turnip-<tag>[-variant]-Wayland.zip):
                      # Linux-style Vulkan ICDs for Bannerlator Wayland containers, imported as a Wayland
                      # game driver. They are not AdrenoTools GPU drivers, so they stay out of this catalog
                      # and out of every drivers.json that copies it.
                      if name.lower().endswith("-wayland.zip"):
                          continue
                      ver_name = name.rsplit(".", 1)[0]
                      entry = {
                          "type":      "GpuDriver",
                          "verName":   ver_name,
                          "verCode":   "0",
                          "remoteUrl": asset["url"],
                      }
                      entries.append(entry)
                      turnip_driver_entries.append(entry)
                      print(f"  Added Turnip: {name} (tag {tag})")
          else:
              print(f"  WARNING: could not list Banners-Turnip releases: {list_result.stderr.strip()}")

          with open("nightlies_components.json", "w") as f:
              json.dump(entries, f, indent=2)
          print(f"\nWritten nightlies_components.json — {len(entries)} entries")

          # Write banners-turnip_drivers.json (flat GpuDriver array, read by mirror workflows)
          with open("banners-turnip_drivers.json", "w") as f:
              json.dump(turnip_driver_entries, f, indent=2)
          print(f"Written banners-turnip_drivers.json — {len(turnip_driver_entries)} entries")

          # Rebuild drivers.json from all per-source JSONs + Banners-Turnip
          print("\nRebuilding drivers.json...")
          driver_entries = []

          for path in ["kimchi/drivers.json", "stevenMXZ/drivers.json"]:
              try:
                  with open(path) as f:
                      data = json.load(f)
                  for rel in data["releases"]:
                      for asset in rel["assets"]:
                          if not asset.get("mirror_url"):
                              continue
                          driver_entries.append({
                              "type":      "GpuDriver",
                              "verName":   f"{rel['tag']} \u2014 {asset['name']}",
                              "verCode":   "0",
                              "remoteUrl": asset["mirror_url"],
                          })
              except FileNotFoundError:
                  print(f"  WARNING: {path} not found, skipping")

          try:
              with open("mtr/drivers.json") as f:
                  data = json.load(f)
              for asset in data["assets"]:
                  if not asset.get("mirror_url"):
                      continue
                  driver_entries.append({
                      "type":      "GpuDriver",
                      "verName":   asset["name"].rsplit(".", 1)[0],
                      "verCode":   "0",
                      "remoteUrl": asset["mirror_url"],
                  })
          except FileNotFoundError:
              print("  WARNING: mtr/drivers.json not found, skipping")

          try:
              with open("white/drivers.json") as f:
                  data = json.load(f)
              for rel in data["releases"]:
                  for asset in rel["assets"]:
                      if not asset.get("mirror_url"):
                          continue
                      driver_entries.append({
                          "type":      "GpuDriver",
                          "verName":   f"{rel['tag']} \u2014 {asset['name']}",
                          "verCode":   "0",
                          "remoteUrl": asset["mirror_url"],
                      })
          except FileNotFoundError:
              print("  WARNING: white/drivers.json not found, skipping")

          driver_entries.extend(turnip_driver_entries)

          with open("drivers.json", "w") as f:
              json.dump(driver_entries, f, indent=2)
          print(f"Rebuilt drivers.json — {len(driver_entries)} entries")
          PY

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightlies_components.json banners-turnip_drivers.json drivers.json
          git diff --staged --quiet && echo "No changes" && exit 0
          NC=$(jq 'length' nightlies_components.json)
          DRV=$(jq 'length' drivers.json)
          git commit -m "chore: update nightlies_components.json (${NC}) + drivers.json (${DRV} drivers) ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git pull --rebase -X ours && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
